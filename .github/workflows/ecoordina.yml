name: e-Coordina · sincronización diaria

# DOS EJECUCIONES DIARIAS. La segunda es RED DE SEGURIDAD, no un duplicado
# molesto: volcar dos veces es inofensivo (mismo cálculo, mismos datos).
#
#   1) '43 22 * * 0-4'  = 22:43 UTC = 00:43 de Madrid en VERANO.
#   2) '43 1 * * 1-5'   = 01:43 UTC = 03:43 de Madrid en VERANO (la de antes).
#
# ⚠️ OJO CON LOS DÍAS DE LA PRIMERA: van 0-4 (dom-jue) porque a las 22:43
# UTC del DOMINGO en España ya es LUNES. Con 1-5 el lunes se quedaría sin
# sincronizar y el viernes se haría de más.
#
# POR QUÉ SE ADELANTÓ (medido el 30/7/2026, 22 ejecuciones de un mes):
# el minuto impar NO evita el retraso. GitHub encola los disparos
# programados y los suelta entre 2h51m y 4h27m tarde, TODOS los días
# (peor los lunes). Con la hora anterior, la sync terminaba entre las
# 06:34 y las 08:10, y en Muralla se ficha a las 06:39: llegaba DESPUÉS
# de que entrara la gente, a diario. El proceso en sí dura 1m 40s: todo
# el retraso está en el arranque, no en la ejecución.
#
# POR QUÉ 00:43 Y NO LA NOCHE ANTERIOR: tiene que seguir siendo el MISMO
# día natural español. Sincronizando el domingo por la noche, un documento
# que caduca el lunes aún figuraría válido y esa persona entraría en verde
# con el apto médico caducado.
#
# ⚠️ Cambio de hora de octubre (CET = UTC+1): pasar a '43 23 * * 0-4' y
# '43 2 * * 1-5'. Lo recuerda solo recordatorio-crons.yml.
# También se puede lanzar a mano desde la pestaña Actions (workflow_dispatch).
#
# MJ-20 (auditoría): si la sync falla, se abre (o actualiza) una issue
# automática en el repo con la etiqueta "sync-fallida" y un enlace al run.
# Si ya hay una issue abierta con esa etiqueta, se añade un comentario en
# vez de crear otra (evita acumular issues duplicadas).
on:
  workflow_dispatch:
  schedule:
    - cron: '43 22 * * 0-4'
    - cron: '43 1 * * 1-5'

permissions:
  contents: read
  issues: write

jobs:
  sincronizar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repo
        uses: actions/checkout@v4

      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Instalar dependencias
        run: npm install

      - name: Instalar navegador de Playwright
        run: npx playwright install --with-deps chromium

      - name: 1) Descargar CSV de e-Coordina
        env:
          ECOORDINA_USER: ${{ secrets.ECOORDINA_USER }}
          ECOORDINA_PASS: ${{ secrets.ECOORDINA_PASS }}
        run: npm run download

      - name: 2) Volcar estados a Supabase
        env:
          SUPABASE_EMAIL: ${{ secrets.SUPABASE_EMAIL }}
          SUPABASE_PASSWORD: ${{ secrets.SUPABASE_PASSWORD }}
        run: npm run sync

      # SEC-035 · Antes este paso subía `output/` —el CSV íntegro de
      # e-Coordina, con el padrón documental de TODAS las obras— en CADA
      # ejecución, a un repositorio PÚBLICO. Ahora solo sube las capturas
      # de `debug/`, solo cuando la sync ha fallado, y se borran a los 7
      # días. Para diagnosticar un fallo hacen falta las capturas, no el CSV.
      - name: Subir capturas de diagnóstico (solo si falla)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: resultado-sync
          path: |
            debug/
          if-no-files-found: warn
          retention-days: 7

      - name: Abrir issue si la sync ha fallado
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          TITULO="⚠️ Sync e-Coordina FALLIDA — $(date -u +'%d/%m/%Y')"
          CUERPO="La sincronización nocturna con e-Coordina ha fallado.

          **Run:** $RUN_URL

          Pasos sugeridos:
          1. Abrir el run y mirar qué paso falló (descarga CSV o volcado a Supabase).
          2. Descargar el artifact \`resultado-sync\` (capturas en \`debug/\`).
          3. Si es un fallo puntual de e-Coordina, relanzar a mano desde la pestaña Actions.
          4. Cerrar esta issue cuando la sync vuelva a estar verde.

          _Issue creada automáticamente por el workflow \`ecoordina.yml\`._"

          # ¿Hay ya una issue abierta con la etiqueta sync-fallida?
          EXISTENTE=$(gh issue list --repo "$GITHUB_REPOSITORY" \
            --label "sync-fallida" --state open --json number --jq '.[0].number' || echo "")

          if [ -n "$EXISTENTE" ] && [ "$EXISTENTE" != "null" ]; then
            gh issue comment "$EXISTENTE" --repo "$GITHUB_REPOSITORY" \
              --body "❌ Ha vuelto a fallar. Run: $RUN_URL"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" \
              --title "$TITULO" \
              --body "$CUERPO" \
              --label "sync-fallida" || \
            gh issue create --repo "$GITHUB_REPOSITORY" \
              --title "$TITULO" \
              --body "$CUERPO"
          fi
