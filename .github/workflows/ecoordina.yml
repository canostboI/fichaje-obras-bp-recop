name: e-Coordina · sincronización diaria

# DOS EJECUCIONES DIARIAS. La segunda es RED DE SEGURIDAD, no un duplicado
# molesto: volcar dos veces es inofensivo (mismo cálculo, mismos datos).
#
#   1) '43 22 * * 0-4'  = 22:43 UTC = 00:43 de Madrid en VERANO.
#   2) '43 1 * * 1-5'   = 01:43 UTC = 03:43 de Madrid en VERANO (la de antes).
#
# ⚠️ OJO CON LOS DÍAS DE LA PRIMERA: van 0-4 (dom-jue) porque a las 22:43
# UTC del DOMINGO en España ya es LUNES. Con 1-5 el lunes se quedaría sin
# sincronizar y el viernes se haría de más.
#
# POR QUÉ SE ADELANTÓ (medido el 30/7/2026, 22 ejecuciones de un mes):
# el minuto impar NO evita el retraso. GitHub encola los disparos
# programados y los suelta entre 2h51m y 4h27m tarde, TODOS los días
# (peor los lunes). Con la hora anterior, la sync terminaba entre las
# 06:34 y las 08:10, y en Muralla se ficha a las 06:39: llegaba DESPUÉS
# de que entrara la gente, a diario. El proceso en sí dura 1m 40s: todo
# el retraso está en el arranque, no en la ejecución.
#
# POR QUÉ 00:43 Y NO LA NOCHE ANTERIOR: tiene que seguir siendo el MISMO
# día natural español. Sincronizando el domingo por la noche, un documento
# que caduca el lunes aún figuraría válido y esa persona entraría en verde
# con el apto médico caducado.
#
# H-88 (Tanda 5): YA NO HAY QUE TOCAR NADA EN EL CAMBIO DE HORA. Están las
# cuatro líneas, las de verano y las de invierno, y el trabajo «decidir» deja
# pasar solo las de la estación en curso (mira el desfase de Madrid:
# +0200 verano, +0100 invierno). Las de la otra estación terminan en 10 s
# sin hacer nada. Los cambios de hora son domingo a las 01:00 UTC y ninguna
# de estas líneas cae en sábado noche, así que nunca se cruzan.
# También se puede lanzar a mano desde la pestaña Actions (workflow_dispatch)
# y desde el botón «Actualizar ahora» de jefe/documentos-ecoordina.html
# (máx. 2 al día, 30 min entre ellas; los topes viven en la BD).
#
# MJ-20 (auditoría): si la sync falla, se abre (o actualiza) una issue
# automática en el repo con la etiqueta "sync-fallida" y un enlace al run.
# Si ya hay una issue abierta con esa etiqueta, se añade un comentario en
# vez de crear otra (evita acumular issues duplicadas).
on:
  workflow_dispatch:
  schedule:
    - cron: '43 22 * * 0-4'   # verano: 00:43 Madrid
    - cron: '43 1 * * 1-5'    # verano: 03:43 Madrid
    - cron: '43 23 * * 0-4'   # invierno: 00:43 Madrid
    - cron: '43 2 * * 1-5'    # invierno: 03:43 Madrid

permissions:
  contents: read
  issues: write

# Nunca dos sincronizaciones a la vez (17/9/2026). Desde el botón
# «Actualizar e-Coordina ahora» del jefe (RPC pedir_sync_ecoordina) se puede
# lanzar mientras corre la de madrugada: la segunda ESPERA a que acabe la
# primera, no la cancela. Así e-Coordina no recibe dos inicios de sesión
# simultáneos con la misma cuenta.

jobs:
  # H-88: ¿esta línea del cron es la de la estación en curso? Las lanzadas a
  # mano (botón del jefe, pestaña Actions) pasan siempre.
  decidir:
    runs-on: ubuntu-latest
    outputs:
      seguir: ${{ steps.toca.outputs.seguir }}
    steps:
      - name: ¿Toca en esta estación?
        id: toca
        env:
          EVENTO: ${{ github.event_name }}
          LINEA: ${{ github.event.schedule }}
        run: |
          DESFASE=$(TZ=Europe/Madrid date +%z)
          SEGUIR=true
          if [ "$EVENTO" = "schedule" ]; then
            case "$LINEA" in
              '43 22 * * 0-4'|'43 1 * * 1-5') [ "$DESFASE" = "+0200" ] || SEGUIR=false ;;
              '43 23 * * 0-4'|'43 2 * * 1-5') [ "$DESFASE" = "+0100" ] || SEGUIR=false ;;
            esac
          fi
          echo "Línea: ${LINEA:-manual} · desfase Madrid: $DESFASE · sigue: $SEGUIR"
          echo "seguir=$SEGUIR" >> "$GITHUB_OUTPUT"

  sincronizar:
    needs: decidir
    if: needs.decidir.outputs.seguir == 'true'
    # H-88: el turno va en el trabajo, no en todo el workflow, para que las
    # líneas de la otra estación (que no hacen nada) no ocupen la cola.
    concurrency:
      group: ecoordina-sync
      cancel-in-progress: false
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repo
        # H-41: acciones fijadas por commit (no por etiqueta, que se puede mover).
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Preparar Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      - name: Instalar dependencias
        # H-41: instala EXACTAMENTE lo de package-lock.json (versiones y huellas);
        # si algo no cuadra, falla en vez de bajar otra versión.
        run: npm ci --no-audit --no-fund

      - name: Instalar navegador de Playwright
        run: npx playwright install --with-deps chromium

      - name: 1) Descargar CSV de e-Coordina
        id: descarga
        env:
          ECOORDINA_USER: ${{ secrets.ECOORDINA_USER }}
          ECOORDINA_PASS: ${{ secrets.ECOORDINA_PASS }}
        run: npm run download

      - name: 2) Volcar estados a Supabase
        env:
          SUPABASE_EMAIL: ${{ secrets.SUPABASE_EMAIL }}
          SUPABASE_PASSWORD: ${{ secrets.SUPABASE_PASSWORD }}
        run: npm run sync

      # 1/10/2026 · Si muere la DESCARGA, el robot no llega a la base de datos
      # y la app no se entera (run #138). Este paso apunta una fila 'error' en
      # ecoordina_sync: el jefe lo ve en la pantalla del botón y el admin en el
      # cuadro de mando. No toca colores. Si falla él también, no tumba nada.
      - name: Apuntar el fallo en la app (si falló la descarga)
        if: failure() && steps.descarga.outcome == 'failure'
        continue-on-error: true
        env:
          SUPABASE_EMAIL: ${{ secrets.SUPABASE_EMAIL }}
          SUPABASE_PASSWORD: ${{ secrets.SUPABASE_PASSWORD }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node scripts/ecoordina-registrar-fallo.mjs

      # SEC-035 · Antes este paso subía `output/` —el CSV íntegro de
      # e-Coordina, con el padrón documental de TODAS las obras— en CADA
      # ejecución, a un repositorio PÚBLICO. Ahora solo sube las capturas
      # de `debug/`, solo cuando la sync ha fallado, y se borran a los 7
      # días. Para diagnosticar un fallo hacen falta las capturas, no el CSV.
      - name: Subir capturas de diagnóstico (solo si falla)
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: resultado-sync
          path: |
            debug/
          if-no-files-found: warn
          retention-days: 7

      - name: Abrir issue si la sync ha fallado
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          TITULO="⚠️ Sync e-Coordina FALLIDA — $(date -u +'%d/%m/%Y')"
          CUERPO="La sincronización nocturna con e-Coordina ha fallado.

          **Run:** $RUN_URL

          Pasos sugeridos:
          1. Abrir el run y mirar qué paso falló (descarga CSV o volcado a Supabase).
          2. Descargar el artifact \`resultado-sync\` (capturas en \`debug/\`).
          3. Si es un fallo puntual de e-Coordina, relanzar a mano desde la pestaña Actions.
          4. Cerrar esta issue cuando la sync vuelva a estar verde.

          _Issue creada automáticamente por el workflow \`ecoordina.yml\`._"

          # ¿Hay ya una issue abierta con la etiqueta sync-fallida?
          EXISTENTE=$(gh issue list --repo "$GITHUB_REPOSITORY" \
            --label "sync-fallida" --state open --json number --jq '.[0].number' || echo "")

          if [ -n "$EXISTENTE" ] && [ "$EXISTENTE" != "null" ]; then
            gh issue comment "$EXISTENTE" --repo "$GITHUB_REPOSITORY" \
              --body "❌ Ha vuelto a fallar. Run: $RUN_URL"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" \
              --title "$TITULO" \
              --body "$CUERPO" \
              --label "sync-fallida" || \
            gh issue create --repo "$GITHUB_REPOSITORY" \
              --title "$TITULO" \
              --body "$CUERPO"
          fi
