name: Recordatorio · cambio de hora en crons

# H-88 (Tanda 5, 15/10/2026): desde ahora NO HAY QUE MOVER NINGÚN CRON.
# ecoordina.yml lleva las líneas de verano y de invierno y deja pasar solo las
# de la estación en curso; los pg_cron que dependen de la hora española
# (aviso_ronda_1/2/3, auditoria_permisos_diaria, reloj_naranja_diario y
# papeles_subcontratas_diario) corren a las dos horas UTC posibles y solo
# trabajan si en Madrid es la hora buena. Esta issue queda como repaso.
#
# MJ-23 (auditoría usabilidad): los crons van en UTC pero España cambia
# de hora dos veces al año. Este workflow abre una issue automática:
#   · 1 de OCTUBRE  → recordar ATRASAR los crons (invierno, UTC+1)
#   · 1 de MARZO    → recordar ADELANTAR los crons (verano, UTC+2)
# El cambio real de hora es el último domingo del mes: la issue llega
# con margen de sobra.
# Minuto "raro" a propósito (congestión de GitHub Actions).
# También se puede lanzar a mano desde la pestaña Actions.
#
# ⚠️ ACTUALIZADO 22/9/2026: añadido `comprobar_entregas_sms` (jobid=15), el que
# vuelve a preguntar a Twilio si cada SMS llegó de verdad. Twilio responde 201 al
# crear el mensaje y el fallo llega después: entre el 17 y el 22/9 fallaron 51
# SMS seguidos (error 21703, servicio sin remitente) y todo decía «enviado».
# **NO necesita ajuste estacional**: `*/15 5-20 * * *`, cada 15 min; en invierno
# empieza y acaba una hora antes en Madrid y no importa.
#
# ⚠️ ACTUALIZADO 21/9/2026: añadido `papeles_subcontratas_diario` (jobid=14),
# el que cierra la puerta al personal de una subcontrata que lleva más de 5 días
# laborables sin contrato entre empresas o sin el libro de subcontratación
# firmado. **NO necesita ajuste estacional**: corre a `10 4 * * *` (06:10 Madrid
# en verano, 05:10 en invierno) y cuenta los laborables de Madrid por dentro.
# Va JUSTO ANTES del reloj del naranja a propósito: si una empresa cierra a toda
# su gente, el reloj ya no tiene a quién mirar. Le aplica el mismo aviso de
# margen estrecho que a aquél.
#
# ⚠️ ACTUALIZADO 20/9/2026: añadido `reloj_naranja_diario` (jobid=13), el que
# pasa a ROJO el naranja que no respalda nadie (alta manual de subcontrata sin
# comprobar, o persona desaparecida del Excel de e-Coordina) a los 2 días
# LABORABLES. **NO necesita ajuste estacional**: corre a `15 4 * * *` (06:15
# Madrid en verano, 05:15 en invierno) y cuenta los días laborables con
# `now() AT TIME ZONE 'Europe/Madrid'` DENTRO de la función.
# 🔴 **PERO es el cron con el margen más estrecho de todos.** Tiene que correr
# DESPUÉS de la sync nocturna de e-Coordina (que con retraso puede terminar
# hasta las ~04:30 Madrid) y ANTES del primer fichaje del día (06:39 en
# Muralla). En verano quedan 24 minutos de margen. Si alguna obra empieza a
# fichar antes de las 06:15, HAY QUE ADELANTARLO. Si algún día corriera por
# delante de la sync, el daño es pequeño y se arregla solo —la propia sync
# devuelve el color bueno— pero deja una incidencia falsa de `naranja_caducado`.
#
# ⚠️ ACTUALIZADO 18/9/2026: añadido `vigilante_obra_diario` (jobid=12),
# el que escribe cada noche en `incidencias` lo que ese día era verdad en
# obra (habilitación caducada de quien fichó, empresa activa en rojo por
# contrato o libro, RP ausente o sin 60h, contrato/libro que caduca).
# **NO necesita ajuste estacional**: corre a `0 19 * * 1-6` (21:00 Madrid en
# verano, 20:00 en invierno) y calcula el día con `now() AT TIME ZONE
# 'Europe/Madrid'` DENTRO de la función; a esa hora la jornada ya terminó
# en las dos estaciones. Figura aquí porque la lista tiene que estar COMPLETA.
#
# ⚠️ ACTUALIZADO 9/9/2026: los tres `aviso_ronda_*` (jobids 2, 3 y 4) pasaron
# el 8/9 de `1-5` a `1-6` (ahora también avisan en sábado; la función comprueba
# que haya alguien fichado antes de mandar nada). Las tablas de abajo llevaban
# el `1-5` viejo: la issue de octubre habría hecho revertir el sábado sin que
# nadie se diera cuenta. Corregido. **Solo cambia la HORA, nunca los días.**
#
# ⚠️ ACTUALIZADO 3/9/2026: añadido `caducar_forzados_diario` (jobid=11),
# el que retira los estados forzados cuando se les acaba el margen de 5 días.
# **NO necesita ajuste estacional**: corre a `30 3 * * *` (05:30 Madrid en
# verano, 04:30 en invierno) y calcula la fecha con `now() AT TIME ZONE
# 'Europe/Madrid'` DENTRO de la función, no con la hora del cron. Las dos
# horas caen muy por delante de los primeros fichajes (06:39 en Muralla),
# que es la única restricción real: nadie debe encontrarse en la valla un
# color que iba a cambiar diez minutos después. Figura aquí porque la lista
# tiene que estar COMPLETA.
#
# ⚠️ ACTUALIZADO 30/8/2026: añadido `caducar-fotos-identidad` (jobid=8),
# el borrado de las fotos de la cara al año sin fichar. **NO necesita ajuste
# estacional**: corre una vez por semana (`30 4 * * 0`) y lo único que hace
# es comparar fechas contra un umbral de 12 meses. Que se ejecute a las 5 o
# a las 6 de la mañana española da exactamente igual. Figura aquí porque la
# lista tiene que estar COMPLETA: el día que alguien la lea buscando "qué
# crons hay", este tiene que aparecer.
#
# ⚠️ ACTUALIZADO 28/8/2026: añadido `recordatorio_solicitudes_acceso`
# (jobid=7), el segundo SMS al jefe de obra cuando una petición de acceso
# lleva 30 minutos sin respuesta. **NO necesita ajuste estacional**: corre
# cada 10 minutos todo el día y decide si es horario de obra leyendo la
# hora de Madrid DENTRO de la función (06:00–21:00), no el cron. Figura
# aquí igualmente para que la lista sea completa: un recordatorio que no
# nombra un cron hace creer que ese cron no existe.
#
# ⚠️ ACTUALIZADO 26/8/2026: sacado `autocierre_nocturno` de las tablas.
# Desde hoy corre a `0 2 * * *` UTC (04:00 Madrid verano / 03:00
# invierno). A esa hora SIEMPRE es "el día siguiente" en Madrid, así
# que fecha_objetivo = ayer siempre apunta bien. No necesita ajuste
# estacional. El cron viejo (30 22) en invierno caía a las 23:30 del
# MISMO día y fecha_objetivo apuntaba al día equivocado.
#
# ⚠️ ACTUALIZADO 3/8/2026: añadido `auditoria_permisos_diaria` (el
# vigilante de permisos, creado el 2/8).
#
# ⚠️ ACTUALIZADO 31/7/2026: `ecoordina.yml` tiene DOS líneas `cron:`
# desde el 30/7 (SYNC-TARDE). Antes aquí solo figuraba una, la de
# `1-5`: la issue de octubre habría hecho cambiar una sola y la otra
# se habría quedado una hora tarde, en silencio. Si algún día se añade
# o se quita una línea de cron en cualquier workflow, HAY QUE TOCAR
# ESTE ARCHIVO TAMBIÉN.

on:
  workflow_dispatch:
  schedule:
    - cron: '17 6 1 10 *'   # 1 de octubre
    - cron: '17 6 1 3 *'    # 1 de marzo

permissions:
  issues: write

jobs:
  recordar:
    runs-on: ubuntu-latest
    steps:
      - name: Abrir issue recordatorio
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          MES=$(date -u +'%m')
          if [ "$MES" = "10" ]; then
            TITULO="🕐 Cambio de hora (INVIERNO): repaso — $(date -u +'%Y')"
          else
            TITULO="🕑 Cambio de hora (VERANO): repaso — $(date -u +'%Y')"
          fi

          CUERPO="El cambio real es el **último domingo de este mes**. Desde H-88 (octubre de 2026) **no hay que mover ningún cron**: se ajustan solos.

          ## Repaso del lunes siguiente al cambio

          - [ ] Cuadro de mando → «Automatismos» en verde.
          - [ ] En Actions, las ejecuciones de \`ecoordina.yml\` de esa madrugada: una con el trabajo «sincronizar» hecho y otra que termina en «decidir» (la de la otra estación). Si las dos se quedan en «decidir», la sync no ha corrido.
          - [ ] \`ecoordina_sync\`: la ejecución buena termina de madrugada, antes de los primeros fichajes.
          - [ ] Los SMS de ronda llegan a su hora española de siempre (09:30, 10:00, 11:00).

          > ⚠️ Si se crea un cron nuevo que dependa de la hora española, hay que hacerlo igual: las dos horas UTC en el cron y la comprobación de la hora de Madrid dentro.

          _Issue creada automáticamente por \`recordatorio-crons.yml\` (MJ-23, H-88)._"

          gh issue create --repo "$GITHUB_REPOSITORY" \
            --title "$TITULO" \
            --body "$CUERPO" \
            --label "cambio-hora" || \
          gh issue create --repo "$GITHUB_REPOSITORY" \
            --title "$TITULO" \
            --body "$CUERPO"
