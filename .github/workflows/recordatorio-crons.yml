name: Recordatorio · cambio de hora en crons

# MJ-23 (auditoría usabilidad): los crons van en UTC pero España cambia
# de hora dos veces al año. Este workflow abre una issue automática:
#   · 1 de OCTUBRE  → recordar ATRASAR los crons (invierno, UTC+1)
#   · 1 de MARZO    → recordar ADELANTAR los crons (verano, UTC+2)
# El cambio real de hora es el último domingo del mes: la issue llega
# con margen de sobra.
# Minuto "raro" a propósito (congestión de GitHub Actions).
# También se puede lanzar a mano desde la pestaña Actions.
#
# ⚠️ ACTUALIZADO 28/8/2026: añadido `recordatorio_solicitudes_acceso`
# (jobid=7), el segundo SMS al jefe de obra cuando una petición de acceso
# lleva 30 minutos sin respuesta. **NO necesita ajuste estacional**: corre
# cada 10 minutos todo el día y decide si es horario de obra leyendo la
# hora de Madrid DENTRO de la función (06:00–21:00), no el cron. Figura
# aquí igualmente para que la lista sea completa: un recordatorio que no
# nombra un cron hace creer que ese cron no existe.
#
# ⚠️ ACTUALIZADO 26/8/2026: sacado `autocierre_nocturno` de las tablas.
# Desde hoy corre a `0 2 * * *` UTC (04:00 Madrid verano / 03:00
# invierno). A esa hora SIEMPRE es "el día siguiente" en Madrid, así
# que fecha_objetivo = ayer siempre apunta bien. No necesita ajuste
# estacional. El cron viejo (30 22) en invierno caía a las 23:30 del
# MISMO día y fecha_objetivo apuntaba al día equivocado.
#
# ⚠️ ACTUALIZADO 3/8/2026: añadido `auditoria_permisos_diaria` (el
# vigilante de permisos, creado el 2/8).
#
# ⚠️ ACTUALIZADO 31/7/2026: `ecoordina.yml` tiene DOS líneas `cron:`
# desde el 30/7 (SYNC-TARDE). Antes aquí solo figuraba una, la de
# `1-5`: la issue de octubre habría hecho cambiar una sola y la otra
# se habría quedado una hora tarde, en silencio. Si algún día se añade
# o se quita una línea de cron en cualquier workflow, HAY QUE TOCAR
# ESTE ARCHIVO TAMBIÉN.

on:
  workflow_dispatch:
  schedule:
    - cron: '17 6 1 10 *'   # 1 de octubre
    - cron: '17 6 1 3 *'    # 1 de marzo

permissions:
  issues: write

jobs:
  recordar:
    runs-on: ubuntu-latest
    steps:
      - name: Abrir issue recordatorio
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          MES=$(date -u +'%m')

          if [ "$MES" = "10" ]; then
            TITULO="🕐 Cambio de hora (INVIERNO): atrasar los crons — $(date -u +'%Y')"
            DIRECCION="España pasa a **UTC+1** el último domingo de octubre. Hay que sumar **+1 hora** a todos los crons UTC para que sigan corriendo a la misma hora española."
            TABLA="| Cron | Ahora (verano) | Cambiar a (invierno) |
          |------|----------------|----------------------|
          | GitHub · \`ecoordina.yml\` (1ª línea, la buena) | \`43 22 * * 0-4\` | \`43 23 * * 0-4\` |
          | GitHub · \`ecoordina.yml\` (2ª línea, refuerzo) | \`43 1 * * 1-5\` | \`43 2 * * 1-5\` |
          | pg_cron · \`aviso_ronda_1\` | \`30 7 * * 1-5\` | \`30 8 * * 1-5\` |
          | pg_cron · \`aviso_ronda_2\` | \`0 8 * * 1-5\` | \`0 9 * * 1-5\` |
          | pg_cron · \`aviso_ronda_3\` | \`0 9 * * 1-5\` | \`0 10 * * 1-5\` |
          | pg_cron · \`auditoria_permisos_diaria\` | \`0 5 * * *\` | \`0 6 * * *\` |"
          else
            TITULO="🕑 Cambio de hora (VERANO): adelantar los crons — $(date -u +'%Y')"
            DIRECCION="España pasa a **UTC+2** el último domingo de marzo. Hay que restar **-1 hora** a todos los crons UTC para que sigan corriendo a la misma hora española."
            TABLA="| Cron | Ahora (invierno) | Cambiar a (verano) |
          |------|------------------|--------------------|
          | GitHub · \`ecoordina.yml\` (1ª línea, la buena) | \`43 23 * * 0-4\` | \`43 22 * * 0-4\` |
          | GitHub · \`ecoordina.yml\` (2ª línea, refuerzo) | \`43 2 * * 1-5\` | \`43 1 * * 1-5\` |
          | pg_cron · \`aviso_ronda_1\` | \`30 8 * * 1-5\` | \`30 7 * * 1-5\` |
          | pg_cron · \`aviso_ronda_2\` | \`0 9 * * 1-5\` | \`0 8 * * 1-5\` |
          | pg_cron · \`aviso_ronda_3\` | \`0 10 * * 1-5\` | \`0 9 * * 1-5\` |
          | pg_cron · \`auditoria_permisos_diaria\` | \`0 6 * * *\` | \`0 5 * * *\` |"
          fi

          CUERPO="$DIRECCION

          El cambio real es el **último domingo de este mes**. Hacer el ajuste ese fin de semana (o el lunes siguiente).

          ## Checklist

          $TABLA

          > ⚠️ **\`ecoordina.yml\` tiene DOS líneas \`cron:\`, y hay que cambiar LAS DOS.** La primera (\`0-4\`, dom-jue) es la que hace el trabajo; la segunda (\`1-5\`) es red de seguridad por si GitHub retrasa el disparo. **Los días distintos NO son una errata:** a las 22:43 UTC del domingo, en España ya es lunes. Solo cambia la HORA, nunca los días.

          **Cómo:**
          - [ ] \`ecoordina.yml\`: editar **las DOS líneas** \`cron:\` en el repo.
          - [ ] pg_cron (los 4 de la tabla): en Supabase → SQL Editor, un \`SELECT cron.alter_job(jobid, schedule => '...')\` por cada uno, o desde la UI de Integrations → Cron.
          - [ ] **NO tocar estos dos, que funcionan en ambas estaciones:** \`autocierre_nocturno\` (\`0 2 * * *\`) y \`recordatorio_solicitudes_acceso\` (\`*/10 * * * *\`, decide el horario de obra leyendo la hora de Madrid por dentro).
          - [ ] Verificar al día siguiente que la sync nocturna y los SMS de ronda llegan a su hora española habitual.
          - [ ] Comprobar en \`ecoordina_sync\` que la ejecución buena sigue terminando de madrugada, muy por delante de los fichajes de las 06:39 en Muralla.

          > ⚠️ **Esta lista es código que envejece.** Si se crea un cron nuevo (pg_cron o GitHub Actions), hay que añadirlo AQUÍ el mismo día. Un recordatorio incompleto es peor que ninguno: hace creer que el repaso está hecho.

          _Issue creada automáticamente por \`recordatorio-crons.yml\` (MJ-23)._"

          gh issue create --repo "$GITHUB_REPOSITORY" \
            --title "$TITULO" \
            --body "$CUERPO" \
            --label "cambio-hora" || \
          gh issue create --repo "$GITHUB_REPOSITORY" \
            --title "$TITULO" \
            --body "$CUERPO"
