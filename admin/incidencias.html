<!DOCTYPE html>
<html lang="es">
<head>

<title>Incidencias — Admin</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root {
    --verde: #4caf50; --naranja: #ff9800; --rojo: #f44336; --azul: #2196f3;
    --bg: #111318; --bg2: #1a1d24; --bg3: #22262f; --borde: #2e3340;
    --texto: #e8eaf0; --texto2: #8b909e; --sidebar-w: 200px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: var(--bg); color: var(--texto); min-height: 100vh; display: flex; }
  .sidebar { width: var(--sidebar-w); background: var(--bg2); border-right: 1px solid var(--borde); display: flex; flex-direction: column; position: fixed; top: 0; left: 0; bottom: 0; z-index: 10; }
  .sidebar-brand { padding: 18px 16px; border-bottom: 1px solid var(--borde); display: flex; align-items: center; justify-content: center; gap: 14px; }
  .sidebar-brand img { height: 22px; width: auto; opacity: 0.9; }
  .sidebar-section { padding: 18px 14px 6px; font-size: 10px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; color: var(--texto2); }
  .sidebar a { display: flex; align-items: center; gap: 10px; padding: 10px 14px; font-size: 14px; color: var(--texto2); text-decoration: none; border-radius: 8px; margin: 2px 8px; transition: background 0.15s, color 0.15s; }
  .sidebar a:hover { background: var(--bg3); color: var(--texto); }
  .sidebar a.activo { background: var(--bg3); color: var(--texto); font-weight: 600; }
  .sidebar a .ico { font-size: 16px; width: 20px; text-align: center; }
  .sidebar-bottom { margin-top: auto; padding: 16px; border-top: 1px solid var(--borde); }
  .btn-salir { width: 100%; background: transparent; border: 1px solid var(--borde); color: var(--texto2); padding: 9px 14px; border-radius: 8px; cursor: pointer; font-size: 13px; font-family: inherit; text-align: left; display: flex; align-items: center; gap: 8px; }
  .btn-salir:hover { background: var(--bg3); color: var(--texto); }
  .main { margin-left: var(--sidebar-w); flex: 1; display: flex; flex-direction: column; }
  .topbar { padding: 20px 28px; display: flex; align-items: center; justify-content: space-between; }
  .topbar h1 { font-size: 22px; font-weight: 800; letter-spacing: 0.5px; text-transform: uppercase; }
  .btn-imprimir { background: var(--bg2); border: 1px solid var(--borde); color: var(--texto); padding: 9px 16px; border-radius: 8px; cursor: pointer; font-size: 13px; font-family: inherit; font-weight: 600; }
  .btn-imprimir:hover { background: var(--bg3); }
  .contenido { padding: 0 28px 28px; }
  .barra-filtros { display: flex; gap: 12px; margin-bottom: 12px; flex-wrap: wrap; align-items: center; }
  .barra-filtros input, .barra-filtros select { background: var(--bg2); border: 1px solid var(--borde); border-radius: 8px; color: var(--texto); font-size: 14px; padding: 9px 14px; font-family: inherit; }
  .barra-filtros input[type="date"] { width: 160px; color-scheme: dark; }
  .barra-filtros select { width: 200px; }
  .barra-filtros input:focus, .barra-filtros select:focus { outline: none; border-color: var(--azul); }
  .barra-filtros .sep { color: var(--texto2); font-size: 13px; }
  .btn-secundario { background: transparent; color: var(--texto2); border: 1px solid var(--borde); padding: 8px 14px; border-radius: 8px; font-size: 13px; cursor: pointer; font-family: inherit; }
  .btn-secundario:hover { background: var(--bg3); color: var(--texto); }
  .barra-rapidos { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
  .btn-rapido { background: transparent; color: var(--texto2); border: 1px solid var(--borde); padding: 6px 12px; border-radius: 20px; font-size: 12px; cursor: pointer; font-family: inherit; }
  .btn-rapido:hover { background: var(--bg3); color: var(--texto); }
  .seccion { background: var(--bg2); border: 1px solid var(--borde); border-radius: 10px; overflow: hidden; margin-bottom: 18px; }
  .seccion-cab { padding: 14px 20px; border-bottom: 1px solid var(--borde); display: flex; align-items: center; justify-content: space-between; }
  .seccion-cab h2 { font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; }
  .badge { font-size: 11px; font-weight: 600; padding: 3px 10px; border-radius: 20px; background: rgba(255,152,0,0.15); color: var(--naranja); }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th { text-align: left; padding: 11px 20px; font-size: 11px; font-weight: 700; color: var(--texto2); text-transform: uppercase; letter-spacing: 0.5px; border-bottom: 1px solid var(--borde); }
  td { padding: 13px 20px; border-bottom: 1px solid var(--borde); vertical-align: middle; }
  tr:last-child td { border-bottom: none; }
  tr:hover td { background: var(--bg3); }
  .pill { display: inline-block; padding: 3px 10px; border-radius: 20px; font-size: 12px; font-weight: 600; }
  .pill.naranja { background: rgba(255,152,0,0.15);  color: var(--naranja); }
  .pill.rojo    { background: rgba(244,67,54,0.15);  color: var(--rojo); }
  .pill.gris    { background: rgba(139,144,158,0.15); color: var(--texto2); }
  .detalle-celda { line-height: 1.4; }
  .comentario { color: var(--texto2); font-size: 12px; margin-top: 3px; font-style: italic; }
  .vacio { padding: 40px 20px; text-align: center; color: var(--texto2); font-size: 14px; }
  .cargando { padding: 40px 20px; text-align: center; color: var(--texto2); }
  .num-grande { font-size: 22px; font-weight: 800; }
  .num-rojo { color: var(--rojo); }
  .num-naranja { color: var(--naranja); }
  .resumen-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0; }
  @media (max-width: 1100px) { .resumen-grid { grid-template-columns: 1fr; } }
  .resumen-col { border-right: 1px solid var(--borde); }
  .resumen-col:last-child { border-right: none; }
  .resumen-col h3 { font-size: 11px; font-weight: 700; color: var(--texto2); text-transform: uppercase; letter-spacing: 0.5px; padding: 12px 20px 8px; }

  .seccion-cab { gap: 12px; }
  .seccion-cab h2 { flex: 1; }

  /* ====== PESTAÑAS ALERTAS / REGISTRO ====== */
  .pestanas { display: flex; gap: 6px; margin-bottom: 12px; border-bottom: 1px solid var(--borde); }
  .pestana { background: transparent; border: none; border-bottom: 2px solid transparent; color: var(--texto2); padding: 10px 16px; font-size: 14px; font-weight: 600; cursor: pointer; font-family: inherit; display: flex; align-items: center; gap: 8px; }
  .pestana:hover { color: var(--texto); }
  .pestana.activa { color: var(--texto); border-bottom-color: var(--azul); }
  .contador-pestana { font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 20px; background: rgba(244,67,54,0.15); color: var(--rojo); }
  .contador-pestana.cero { background: rgba(76,175,80,0.15); color: var(--verde); }
  .aviso-familia { font-size: 12px; color: var(--texto2); padding: 10px 20px; border-bottom: 1px solid var(--borde); background: var(--bg3); }
  .pill.verde { background: rgba(76,175,80,0.15);  color: var(--verde); }
  .pill.azul  { background: rgba(33,150,243,0.15); color: var(--azul); }
  .btn-accion { background: transparent; border: 1px solid var(--borde); color: var(--texto2); padding: 5px 11px; border-radius: 6px; font-size: 12px; cursor: pointer; font-family: inherit; white-space: nowrap; }
  .btn-accion:hover { background: var(--verde); border-color: var(--verde); color: #fff; }
  .btn-accion:disabled { opacity: 0.5; cursor: default; }
  .oculto { display: none !important; }

  /* ====== INFORME IMPRIMIBLE ====== */
  #informe-print { display: none; }
  @media print {
    body { display: block; background: #fff; color: #000; }
    .sidebar, .main { display: none !important; }
    #informe-print { display: block; font-family: Arial, Helvetica, sans-serif; color: #000; }
    @page { margin: 14mm; }
    #informe-print h1 { font-size: 19px; margin-bottom: 2px; }
    #informe-print .sub { font-size: 12px; color: #444; margin-bottom: 14px; }
    #informe-print h2 { font-size: 14px; margin: 16px 0 6px; border-bottom: 2px solid #000; padding-bottom: 3px; }
    #informe-print table { width: 100%; border-collapse: collapse; font-size: 11px; margin-bottom: 8px; }
    #informe-print th, #informe-print td { border: 1px solid #999; padding: 5px 7px; text-align: left; color: #000; }
    #informe-print th { background: #eee; font-size: 10px; text-transform: uppercase; }
    #informe-print .total-linea { font-size: 12px; font-weight: bold; margin: 8px 0 4px; }
    #informe-print tr { page-break-inside: avoid; }
    #informe-print .pie { margin-top: 18px; font-size: 10px; color: #555; }
  }
</style>

<!-- Informe imprimible (solo visible al imprimir) -->
<div id="informe-print"></div>

<script>
const SUPABASE_URL = 'https://istrnsicleopzbsrapsw.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImlzdHJuc2ljbGVvcHpic3JhcHN3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU4MTIxMTYsImV4cCI6MjA5MTM4ODExNn0.5UXV2LWPXmbfLI7rKpZSG9YBzZsesjckHnhQabA0mTY';
const { createClient } = supabase;
const sb = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
AutoLogout.init(sb);

// El INFORME (resumen de arriba + impresión) siempre mira las denegaciones
// de acceso, pase lo que pase en las pestañas de abajo.
const TIPOS_DENEGACION = ['bloqueo_rojo', 'fuera_de_zona'];
let datosInforme = [];

// Filas actualmente pintadas en el listado (para el marcado masivo)
let filasListado = [];

// Pestaña activa del listado: 'alerta' (accionable) o 'rastro' (solo registro)
let familiaActiva = window.IncidenciasFamilias.ALERTA;

(async function init() {
  const { data: { session } } = await sb.auth.getSession();
  if (!session) { window.location.href = '../'; return; }
  const { data: u } = await sb.from('usuarios_app').select('rol').eq('auth_user_id', session.user.id).single();
  if (!u || u.rol !== 'admin') { window.location.href = '../'; return; }
  // Arranca en 7 días: una bandeja es "qué ha pasado últimamente".
  // Para el informe mensual, los botones "Este mes" / "Mes anterior".
  aplicarRango('7dias');
  await cargarObras();
  cargarTipos();
  aplicarAspectoFamilia();
  await buscar();
})();

// ===== Pestañas =====
document.querySelectorAll('.pestana').forEach(b => {
  b.onclick = () => {
    if (familiaActiva === b.dataset.familia) return;
    familiaActiva = b.dataset.familia;
    document.querySelectorAll('.pestana').forEach(x => x.classList.toggle('activa', x === b));
    cargarTipos();            // el desplegable se acota a la familia
    aplicarAspectoFamilia();
    cargarListado();          // el informe de arriba NO se recalcula: no depende de la pestaña
  };
});

// Ajusta títulos, textos y visibilidad del filtro de estado según la pestaña
function aplicarAspectoFamilia() {
  const esAlerta = familiaActiva === window.IncidenciasFamilias.ALERTA;
  document.getElementById('titulo-listado').textContent =
    esAlerta ? 'Alertas — requieren revisión' : 'Registro — solo consulta';
  document.getElementById('aviso-familia').textContent = esAlerta
    ? 'Incidencias que piden una acción: bloqueos, personas sin registrar, móvil compartido y autocierres por corregir.'
    : 'Constancia de cosas ya resueltas o informativas. No hay nada que hacer aquí: es el histórico consultable.';
  document.getElementById('filtro-estado').classList.toggle('oculto', !esAlerta);
}

document.getElementById('btn-salir').onclick = async () => { await sb.auth.signOut(); window.location.href = '../'; };

async function cargarObras() {
  const { data } = await sb.from('obras').select('id, nombre, estado').neq('estado', 'oculta').order('nombre');
  const select = document.getElementById('filtro-obra');
  (data || []).forEach(o => {
    const opt = document.createElement('option');
    opt.value = o.id;
    opt.textContent = (o.estado && o.estado !== 'activa') ? `${o.nombre} (${o.estado})` : o.nombre;
    select.appendChild(opt);
  });
}

// Lista FIJA de tipos, acotada a la pestaña activa.
// (Antes se deducía de las 1.000 filas más recientes, así que con mucho
//  volumen de un solo tipo el desplegable se quedaba incompleto.)
function cargarTipos() {
  const F = window.IncidenciasFamilias;
  const select = document.getElementById('filtro-tipo');
  select.innerHTML = '<option value="">Todos los tipos</option>';
  F.tipos(familiaActiva)
    .map(t => ({ valor: t, texto: F.etiqueta(t) }))
    .sort((a, b) => a.texto.localeCompare(b.texto, 'es'))
    .forEach(t => {
      const opt = document.createElement('option');
      opt.value = t.valor;
      opt.textContent = t.texto;
      select.appendChild(opt);
    });
}

// ===== Rangos rápidos =====
function aplicarRango(rango) {
  const hoy = new Date();
  let desde, hasta;
  if (rango === 'hoy') {
    desde = hasta = hoy;
  } else if (rango === '7dias') {
    hasta = hoy;
    desde = new Date(hoy.getFullYear(), hoy.getMonth(), hoy.getDate() - 6);
  } else if (rango === 'mes') {
    desde = new Date(hoy.getFullYear(), hoy.getMonth(), 1);
    hasta = hoy;
  } else if (rango === 'mes-anterior') {
    desde = new Date(hoy.getFullYear(), hoy.getMonth() - 1, 1);
    hasta = new Date(hoy.getFullYear(), hoy.getMonth(), 0);
  }
  document.getElementById('filtro-desde').value = aISO(desde);
  document.getElementById('filtro-hasta').value = aISO(hasta);
}
function aISO(d) { return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }

document.querySelectorAll('.btn-rapido').forEach(b => {
  b.onclick = () => { aplicarRango(b.dataset.rango); buscar(); };
});
document.getElementById('btn-buscar').onclick = buscar;
document.getElementById('btn-marcar-todas').onclick = marcarTodas;
// Tipo y estado solo afectan al listado de abajo, no al informe de arriba
document.getElementById('filtro-tipo').onchange   = cargarListado;
document.getElementById('filtro-estado').onchange = cargarListado;

// ===== Búsqueda =====
const CAMPOS = 'id, tipo, estado, detalle, comentario, created_at, trabajador_id, obra_id, trabajador:trabajador_id(nombre, apellidos, dni), obra:obra_id(nombre)';

// Filtros que valen para las dos consultas: periodo + obra
function aplicarFiltrosComunes(query) {
  const fDesde = document.getElementById('filtro-desde').value;
  const fHasta = document.getElementById('filtro-hasta').value;
  const obraId = document.getElementById('filtro-obra').value;

  if (fDesde) {
    const [y, m, d] = fDesde.split('-').map(Number);
    query = query.gte('created_at', new Date(y, m - 1, d, 0, 0, 0, 0).toISOString());
  }
  if (fHasta) {
    const [y, m, d] = fHasta.split('-').map(Number);
    query = query.lte('created_at', new Date(y, m - 1, d, 23, 59, 59, 999).toISOString());
  }
  if (obraId) query = query.eq('obra_id', obraId);
  return query;
}

async function buscar() {
  await Promise.all([cargarInforme(), cargarListado()]);
}

// --- 1) Informe de denegaciones: SIEMPRE los mismos tipos ---
// Va en su propia consulta para que las miles de incidencias de rastro
// no le coman el límite de filas y lo dejen incompleto sin avisar.
async function cargarInforme() {
  document.getElementById('resumen').innerHTML = '<div class="cargando">Cargando…</div>';

  let query = sb.from('incidencias').select(CAMPOS)
    .in('tipo', TIPOS_DENEGACION)
    .order('created_at', { ascending: false }).limit(2000);

  const { data, error } = await aplicarFiltrosComunes(query);

  if (error) {
    document.getElementById('badge-resumen').textContent = 'Error';
    document.getElementById('resumen').innerHTML = '<div class="vacio">Error al cargar: ' + esc(error.message) + '</div>';
    datosInforme = [];
    return;
  }
  datosInforme = data || [];
  pintarResumen(datosInforme);
}

// --- 2) Listado de la pestaña activa ---
async function cargarListado() {
  const F = window.IncidenciasFamilias;
  document.getElementById('tabla-incidencias').innerHTML = '<div class="cargando">Cargando…</div>';

  const tipo   = document.getElementById('filtro-tipo').value;
  const estado = document.getElementById('filtro-estado').value;
  const esAlerta = familiaActiva === F.ALERTA;

  let query = sb.from('incidencias').select(CAMPOS)
    .order('created_at', { ascending: false }).limit(1000);

  // Filtrado por familia EN EL SERVIDOR (no traer todo y descartar aquí)
  query = tipo ? query.eq('tipo', tipo) : query.in('tipo', F.tipos(familiaActiva));
  if (esAlerta && estado) query = query.eq('estado', estado);

  const { data, error } = await aplicarFiltrosComunes(query);

  if (error) {
    document.getElementById('badge-total').textContent = 'Error';
    document.getElementById('tabla-incidencias').innerHTML = '<div class="vacio">Error al cargar: ' + esc(error.message) + '</div>';
    return;
  }

  pintarListado(data || []);
  actualizarContadorAlertas();
}

// --- Contador de alertas pendientes de la pestaña ---
async function actualizarContadorAlertas() {
  const F = window.IncidenciasFamilias;
  const el = document.getElementById('contador-alertas');

  let query = sb.from('incidencias')
    .select('id', { count: 'exact', head: true })
    .in('tipo', F.tipos(F.ALERTA))
    .eq('estado', 'nueva');

  const { count, error } = await aplicarFiltrosComunes(query);

  if (error) { el.textContent = '—'; el.classList.remove('cero'); return; }
  el.textContent = count || 0;
  el.classList.toggle('cero', !count);
}

// ===== Marcado masivo de las alertas EN PANTALLA =====
// Se marcan solo las filas que el admin está viendo, no todo el periodo.
function nuevasEnPantalla() {
  return filasListado.filter(i => i.estado === 'nueva');
}

function actualizarBotonMasivo() {
  const btn = document.getElementById('btn-marcar-todas');
  const n = (familiaActiva === window.IncidenciasFamilias.ALERTA) ? nuevasEnPantalla().length : 0;
  btn.classList.toggle('oculto', n === 0);
  btn.disabled = false;
  btn.textContent = '✓ Marcar las ' + n + ' como revisadas';
}

async function marcarTodas() {
  const pendientes = nuevasEnPantalla();
  if (pendientes.length === 0) return;

  if (!confirm('¿Marcar como revisadas las ' + pendientes.length + ' alertas que tienes en pantalla?\n\n' +
               'No se puede deshacer desde aquí.')) return;

  const btn = document.getElementById('btn-marcar-todas');
  btn.disabled = true;

  let hechas = 0, fallos = 0;

  // De 8 en 8: ni una a una (lento) ni 78 de golpe (avalancha de peticiones)
  for (let i = 0; i < pendientes.length; i += 8) {
    const lote = pendientes.slice(i, i + 8);
    btn.textContent = 'Marcando… ' + hechas + '/' + pendientes.length;

    const res = await Promise.all(lote.map(inc =>
      sb.rpc('marcar_incidencia_vista', { p_incidencia_id: inc.id })
    ));
    res.forEach(r => {
      if (r.error || !r.data || r.data.success === false) fallos++; else hechas++;
    });
  }

  if (fallos > 0) alert('Marcadas ' + hechas + '. No se pudieron marcar ' + fallos + '.');
  await cargarListado();
}

// ===== Marcar una alerta como revisada =====
async function marcarRevisada(id, boton) {
  if (!confirm('¿Marcar esta incidencia como revisada?\n\nNo se puede deshacer desde aquí.')) return;

  boton.disabled = true;
  boton.textContent = '…';

  const { data, error } = await sb.rpc('marcar_incidencia_vista', { p_incidencia_id: id });

  if (error || !data || data.success === false) {
    alert('No se pudo marcar: ' + ((data && data.error) || (error && error.message) || 'error desconocido'));
    boton.disabled = false;
    boton.textContent = '✓ Revisada';
    return;
  }
  await cargarListado();
}

// ===== Causas: cada incidencia puede aportar una o varias causas =====
// bloqueo_rojo nuevo: detalle = JSON array de motivos → una causa por motivo
// bloqueo_rojo antiguo: texto genérico → "Documentación en rojo (sin detalle)"
// fuera_de_zona: causa fija "Fuera de zona GPS"
function causasDenegacion(inc) {
  if (inc.tipo === 'fuera_de_zona') return ['Fuera de zona GPS'];
  if (inc.tipo !== 'bloqueo_rojo') return null; // no es denegación
  const det = (inc.detalle || '').trim();
  try {
    const arr = JSON.parse(det);
    if (Array.isArray(arr) && arr.length > 0) return arr.map(x => String(x).trim()).filter(Boolean);
  } catch (e) { /* no es JSON: registro antiguo */ }
  return ['Documentación en rojo (sin detalle)'];
}

// ===== Resumen: cuenta TRABAJADORES DISTINTOS por causa (no intentos) =====
function calcularResumen(incs) {
  const porCausa = new Map();          // causa → Set(trabajador_id)
  const porObra  = new Map();          // obra → Set("trabajador|causa")
  const trabajadoresDenegados = new Set();

  incs.forEach(i => {
    const causas = causasDenegacion(i);
    if (!causas) return;
    const tid = i.trabajador_id || 'desconocido';
    const obraNombre = i.obra?.nombre || 'Obra desconocida';
    trabajadoresDenegados.add(tid);
    causas.forEach(c => {
      if (!porCausa.has(c)) porCausa.set(c, new Set());
      porCausa.get(c).add(tid);
      if (!porObra.has(obraNombre)) porObra.set(obraNombre, new Set());
      porObra.get(obraNombre).add(tid + '|' + c);
    });
  });

  const causas = [...porCausa.entries()]
    .map(([causa, set]) => ({ causa, n: set.size }))
    .sort((a, b) => b.n - a.n);
  const obras = [...porObra.entries()]
    .map(([obra, set]) => ({ obra, n: set.size }))
    .sort((a, b) => b.n - a.n);
  const totalIncidencias = causas.reduce((s, c) => s + c.n, 0);

  return { causas, obras, totalIncidencias, totalTrabajadores: trabajadoresDenegados.size };
}

function pintarResumen(incs) {
  const r = calcularResumen(incs);
  document.getElementById('badge-resumen').textContent =
    r.totalIncidencias + ' incidencias · ' + r.totalTrabajadores + ' trabajadores';

  if (r.totalIncidencias === 0) {
    document.getElementById('resumen').innerHTML = '<div class="vacio">Sin accesos denegados en el periodo ✓</div>';
    return;
  }

  document.getElementById('resumen').innerHTML = `
    <div class="resumen-grid">
      <div class="resumen-col">
        <h3>Por causa (trabajadores distintos)</h3>
        <table><tbody>
          ${r.causas.map(c => `<tr>
            <td>${iconoCausa(c.causa)} ${esc(c.causa)}</td>
            <td style="text-align:right; width:80px;"><span class="num-grande ${c.causa === 'Fuera de zona GPS' ? 'num-naranja' : 'num-rojo'}">${c.n}</span></td>
          </tr>`).join('')}
        </tbody></table>
      </div>
      <div class="resumen-col">
        <h3>Por obra</h3>
        <table><tbody>
          ${r.obras.map(o => `<tr>
            <td>🏗 ${esc(o.obra)}</td>
            <td style="text-align:right; width:80px;"><span class="num-grande">${o.n}</span></td>
          </tr>`).join('')}
        </tbody></table>
      </div>
    </div>`;
}

function iconoCausa(c) {
  return c === 'Fuera de zona GPS' ? '📍' : '🔴';
}

// ===== Listado detallado =====
function pintarListado(data) {
  const F = window.IncidenciasFamilias;
  const esAlerta = familiaActiva === F.ALERTA;
  const cont = document.getElementById('tabla-incidencias');

  filasListado = data || [];
  actualizarBotonMasivo();

  if (!data || data.length === 0) {
    document.getElementById('badge-total').textContent = '0 incidencias';
    cont.innerHTML = '<div class="vacio">' +
      (esAlerta ? 'No hay alertas pendientes ✓' : 'Sin registros en este periodo') + '</div>';
    return;
  }
  document.getElementById('badge-total').textContent = data.length + ' registros';

  cont.innerHTML = `
    <table><thead><tr>
      <th>Trabajador</th><th>DNI</th><th>Obra</th><th>Tipo</th><th>Detalle</th><th>Fecha y hora</th>
      <th>Estado</th>${esAlerta ? '<th></th>' : ''}
    </tr></thead><tbody>
    ${data.map(i => `<tr>
      <td><strong>${nombreTrabajador(i)}</strong></td>
      <td>${esc(i.trabajador?.dni) || '—'}</td>
      <td>${esc(i.obra?.nombre) || '—'}</td>
      <td><span class="pill ${colorTipo(i.tipo)}">${esc(F.etiqueta(i.tipo))}</span></td>
      <td class="detalle-celda">${detalleBonito(i)}${i.comentario ? `<div class="comentario">${esc(i.comentario)}</div>` : ''}</td>
      <td>${formatFechaHora(i.created_at)}</td>
      <td><span class="pill ${colorEstado(i.estado)}">${esc(etiquetaEstado(i.estado))}</span></td>
      ${esAlerta ? `<td>${i.estado === 'nueva'
        ? `<button class="btn-accion" data-id="${esc(i.id)}">✓ Revisada</button>`
        : ''}</td>` : ''}
    </tr>`).join('')}
    </tbody></table>`;

  // Los botones se enganchan aquí (nada de onclick con datos incrustados en el HTML)
  cont.querySelectorAll('.btn-accion').forEach(b => {
    b.onclick = () => marcarRevisada(b.dataset.id, b);
  });
}

// La persona puede no tener ficha (presente_sin_registrar): entonces no hay
// trabajador enlazado y el nombre declarado vive dentro del detalle.
function nombreTrabajador(i) {
  const n = ((i.trabajador?.nombre || '') + ' ' + (i.trabajador?.apellidos || '')).trim();
  if (n) return esc(n);
  const decl = leerDetalleObjeto(i);
  if (decl && decl.nombre) return esc(decl.nombre) + ' <span class="comentario">(declarado)</span>';
  return '—';
}

function etiquetaEstado(estado) {
  if (estado === 'revisada') return 'Revisada';
  if (estado === 'resuelta') return 'Resuelta';
  return 'Nueva';
}
function colorEstado(estado) {
  if (estado === 'revisada') return 'azul';
  if (estado === 'resuelta') return 'verde';
  return 'naranja';
}

// Si el detalle es un JSON array de motivos, mostrarlo legible
function detalleBonito(i) {
  const det = (i.detalle || '').trim();
  if (!det) return '—';
  try {
    const val = JSON.parse(det);
    if (Array.isArray(val)) return val.map(m => '• ' + esc(String(m))).join('<br>');
    // Objeto (p.ej. presente_sin_registrar): pares clave: valor, no el JSON crudo
    if (val && typeof val === 'object') {
      return Object.keys(val)
        .filter(k => k !== 'declarado' && val[k] !== null && val[k] !== '')
        .map(k => '<strong>' + esc(etiquetaClave(k)) + ':</strong> ' + esc(String(val[k])))
        .join('<br>') || '—';
    }
  } catch (e) { /* texto normal */ }
  return esc(det);
}

function etiquetaClave(k) {
  const mapa = { dni: 'DNI', nombre: 'Nombre', empresa: 'Empresa', intentos: 'Intentos' };
  return mapa[k] || k;
}

// Devuelve el detalle como objeto si lo es; si no, null.
function leerDetalleObjeto(i) {
  try {
    const val = JSON.parse((i.detalle || '').trim());
    return (val && typeof val === 'object' && !Array.isArray(val)) ? val : null;
  } catch (e) { return null; }
}

function colorTipo(tipo) {
  if (!tipo) return 'gris';
  const t = String(tipo).toLowerCase();
  if (t === 'bloqueo_rojo' || t === 'presente_sin_registrar') return 'rojo';
  if (t === 'autocierre' || t === 'movil_compartido' || t === 'aviso_naranja' || t === 'fuera_de_zona') return 'naranja';
  return 'gris';
}

// ===== Informe imprimible =====
document.getElementById('btn-imprimir').onclick = () => {
  const r = calcularResumen(datosInforme);
  const fDesde = document.getElementById('filtro-desde').value;
  const fHasta = document.getElementById('filtro-hasta').value;
  const selObra = document.getElementById('filtro-obra');
  const obraNombre = selObra.value ? selObra.options[selObra.selectedIndex].text : 'Todas las obras';
  const periodo = (fDesde ? formatFecha(fDesde) : 'inicio') + ' — ' + (fHasta ? formatFecha(fHasta) : 'hoy');

  // Detalle del informe: solo denegaciones, deduplicadas por trabajador+causa
  const vistos = new Set();
  const filas = [];
  // Recorremos de más antiguo a más reciente para quedarnos con la primera vez
  [...datosInforme].sort((a, b) => new Date(a.created_at) - new Date(b.created_at)).forEach(i => {
    const causas = causasDenegacion(i);
    if (!causas) return;
    causas.forEach(c => {
      const clave = (i.trabajador_id || '?') + '|' + c;
      if (vistos.has(clave)) return;
      vistos.add(clave);
      filas.push({
        nombre: ((i.trabajador?.nombre || '') + ' ' + (i.trabajador?.apellidos || '')).trim() || '—',
        dni: i.trabajador?.dni || '—',
        obra: i.obra?.nombre || '—',
        causa: c,
        fecha: formatFechaHora(i.created_at)
      });
    });
  });

  document.getElementById('informe-print').innerHTML = `
    <h1>Informe de incidencias de acceso</h1>
    <div class="sub">
      Obra: <strong>${esc(obraNombre)}</strong> &nbsp;·&nbsp;
      Periodo: <strong>${esc(periodo)}</strong> &nbsp;·&nbsp;
      Generado: ${new Date().toLocaleDateString('es-ES')} ${new Date().toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit' })}
    </div>

    <div class="total-linea">Total: ${r.totalIncidencias} incidencias · ${r.totalTrabajadores} trabajadores afectados</div>

    <h2>Resumen por causa</h2>
    <table><thead><tr><th>Causa de la denegación</th><th style="width:120px;">Trabajadores</th></tr></thead><tbody>
      ${r.causas.length ? r.causas.map(c => `<tr><td>${esc(c.causa)}</td><td>${c.n}</td></tr>`).join('') : '<tr><td colspan="2">Sin denegaciones en el periodo</td></tr>'}
    </tbody></table>

    <h2>Resumen por obra</h2>
    <table><thead><tr><th>Obra</th><th style="width:120px;">Incidencias</th></tr></thead><tbody>
      ${r.obras.length ? r.obras.map(o => `<tr><td>${esc(o.obra)}</td><td>${o.n}</td></tr>`).join('') : '<tr><td colspan="2">—</td></tr>'}
    </tbody></table>

    <h2>Detalle (primera vez registrada de cada caso)</h2>
    <table><thead><tr><th>Trabajador</th><th>DNI</th><th>Obra</th><th>Causa</th><th>Fecha</th></tr></thead><tbody>
      ${filas.length ? filas.map(f => `<tr><td>${esc(f.nombre)}</td><td>${esc(f.dni)}</td><td>${esc(f.obra)}</td><td>${esc(f.causa)}</td><td>${esc(f.fecha)}</td></tr>`).join('') : '<tr><td colspan="5">Sin denegaciones en el periodo</td></tr>'}
    </tbody></table>

    <div class="pie">
      Cada caso cuenta una vez por trabajador y causa, aunque haya habido varios intentos.
      Generado con Fichaje Obras — Bosch Pascual / Rècop.
    </div>`;

  window.print();
};

function esc(txt) { const d = document.createElement('div'); d.textContent = String(txt || ''); return d.innerHTML; }
function formatFechaHora(iso) { if (!iso) return '—'; const d = new Date(iso); return d.toLocaleDateString('es-ES', { day: '2-digit', month: '2-digit' }) + ' ' + d.toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit' }); }
function formatFecha(isoFecha) { const [y, m, d] = isoFecha.split('-'); return d + '/' + m + '/' + y; }
</script>
