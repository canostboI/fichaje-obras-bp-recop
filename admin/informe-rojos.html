<style>
  :root {
    --verde: #4caf50;
    --naranja: #ff9800;
    --rojo: #f44336;
    --azul: #2196f3;
    --bg: #111318;
    --bg2: #1a1d24;
    --bg3: #22262f;
    --borde: #2e3340;
    --texto: #e8eaf0;
    --texto2: #8b909e;
    --sidebar-w: 200px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: var(--bg); color: var(--texto); min-height: 100vh; display: flex; }

  .sidebar { width: var(--sidebar-w); background: var(--bg2); border-right: 1px solid var(--borde); display: flex; flex-direction: column; position: fixed; top: 0; left: 0; bottom: 0; z-index: 10; }
  .sidebar-brand { padding: 18px 16px; border-bottom: 1px solid var(--borde); display: flex; align-items: center; justify-content: center; gap: 14px; }
  .sidebar-brand img { height: 22px; width: auto; opacity: 0.9; }
  .sidebar-section { padding: 18px 14px 6px; font-size: 10px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; color: var(--texto2); }
  .sidebar a { display: flex; align-items: center; gap: 10px; padding: 10px 14px; font-size: 14px; color: var(--texto2); text-decoration: none; border-radius: 8px; margin: 2px 8px; transition: background 0.15s, color 0.15s; }
  .sidebar a:hover { background: var(--bg3); color: var(--texto); }
  .sidebar a.activo { background: var(--bg3); color: var(--texto); font-weight: 600; }
  .sidebar a .ico { font-size: 16px; width: 20px; text-align: center; }
  .sidebar-bottom { margin-top: auto; padding: 16px; border-top: 1px solid var(--borde); }
  .btn-salir { width: 100%; background: transparent; border: 1px solid var(--borde); color: var(--texto2); padding: 9px 14px; border-radius: 8px; cursor: pointer; font-size: 13px; font-family: inherit; text-align: left; display: flex; align-items: center; gap: 8px; transition: background 0.15s, color 0.15s; }
  .btn-salir:hover { background: var(--bg3); color: var(--texto); }

  .main { margin-left: var(--sidebar-w); flex: 1; display: flex; flex-direction: column; min-height: 100vh; }
  .topbar { padding: 20px 28px 0; display: flex; align-items: center; justify-content: space-between; }
  .topbar h1 { font-size: 22px; font-weight: 800; letter-spacing: 0.5px; text-transform: uppercase; }
  .topbar .usuario { font-size: 13px; color: var(--texto2); }
  .contenido { padding: 24px 28px; }

  /* Barra de controles (no se imprime) */
  .controles { background: var(--bg2); border: 1px solid var(--borde); border-radius: 10px; padding: 18px 20px; margin-bottom: 24px; display: flex; flex-wrap: wrap; gap: 16px; align-items: flex-end; }
  .campo { display: flex; flex-direction: column; gap: 6px; }
  .campo label { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; color: var(--texto2); }
  .campo select, .campo input { background: var(--bg3); border: 1px solid var(--borde); color: var(--texto); padding: 9px 12px; border-radius: 8px; font-size: 14px; font-family: inherit; }
  .campo select { min-width: 220px; }
  .btn-generar { background: var(--rojo); border: none; color: #fff; padding: 10px 20px; border-radius: 8px; font-size: 14px; font-weight: 700; cursor: pointer; font-family: inherit; }
  .btn-generar:hover { background: #d63a2f; }
  .btn-imprimir { background: transparent; border: 1px solid var(--borde); color: var(--texto); padding: 10px 20px; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; font-family: inherit; }
  .btn-imprimir:hover { background: var(--bg3); }
  .btn-imprimir:disabled { opacity: 0.4; cursor: not-allowed; }

  .cargando { padding: 40px 20px; text-align: center; color: var(--texto2); font-size: 15px; }
  .aviso-error { padding: 16px 20px; background: rgba(244,67,54,0.12); border: 1px solid var(--rojo); border-radius: 10px; color: var(--texto); font-size: 14px; margin-bottom: 20px; }

  /* ── El informe en sí (se imprime) ── */
  .informe { background: #fff; color: #1a1a1a; border-radius: 10px; padding: 40px 44px; max-width: 820px; }

  .inf-cabecera { display: flex; align-items: flex-start; justify-content: space-between; gap: 20px; border-bottom: 3px solid #1a1a1a; padding-bottom: 20px; margin-bottom: 28px; }
  .inf-cabecera .logo-marca { height: 34px; width: auto; }
  .inf-titulo { font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: 2px; color: #666; }
  .inf-obra { font-size: 26px; font-weight: 800; margin-top: 4px; color: #1a1a1a; }
  .inf-meta { font-size: 13px; color: #555; margin-top: 8px; line-height: 1.5; }
  .inf-cabecera .lado-derecho { text-align: right; }

  .inf-titular { background: #f6f2f2; border-left: 5px solid var(--rojo); padding: 22px 26px; border-radius: 6px; margin-bottom: 32px; }
  .inf-titular .cifra { font-size: 44px; font-weight: 800; color: var(--rojo); line-height: 1; }
  .inf-titular .frase { font-size: 16px; color: #333; margin-top: 10px; line-height: 1.5; max-width: 60ch; text-wrap: pretty; }
  .inf-titular .reparto { font-size: 15px; color: #444; margin-top: 14px; padding-top: 12px; border-top: 1px solid #ddd; line-height: 1.6; }
  .inf-titular .reparto strong { color: #1a1a1a; }

  /* Desenlace: se lee de arriba abajo como una historia, no como 4 filas iguales */
  .des-fila { display: flex; align-items: baseline; gap: 16px; padding: 13px 0; border-bottom: 1px solid #eee; }
  .des-fila:last-child { border-bottom: none; }
  .des-num { font-size: 26px; font-weight: 800; min-width: 58px; text-align: right; color: #1a1a1a; }
  .des-cuerpo { flex: 1; }
  .des-tit { font-size: 15px; font-weight: 700; color: #1a1a1a; }
  .des-exp { font-size: 13px; color: #666; margin-top: 3px; line-height: 1.5; }
  .des-anidada { margin: 4px 0 2px 74px; padding: 10px 14px; background: #f4f8f4; border-left: 3px solid var(--verde); border-radius: 4px; font-size: 13.5px; color: #33553a; line-height: 1.5; }
  .des-anidada strong { color: #1d3d24; }
  .des-cero .des-num { color: var(--verde); }
  .des-cero .des-tit { color: #2c6b35; }
  .cat-estado { font-size: 12.5px; color: #777; font-weight: 400; margin-top: 2px; }
  .cat-empresa { font-size: 11px; font-weight: 700; color: #8a6d3b; background: #fcf4e3; padding: 1px 6px; border-radius: 3px; margin-left: 7px; letter-spacing: 0.3px; }

  .inf-seccion { margin-bottom: 30px; }
  .inf-seccion h2 { font-size: 13px; font-weight: 800; text-transform: uppercase; letter-spacing: 1px; color: #1a1a1a; border-bottom: 1px solid #ddd; padding-bottom: 8px; margin-bottom: 4px; }
  .inf-seccion .subtitulo { font-size: 12px; color: #888; margin-bottom: 12px; }

  table.inf-tabla { width: 100%; border-collapse: collapse; font-size: 14px; }
  table.inf-tabla th { text-align: left; padding: 9px 12px; font-size: 11px; font-weight: 700; color: #666; text-transform: uppercase; letter-spacing: 0.5px; border-bottom: 2px solid #ddd; }
  table.inf-tabla th.num, table.inf-tabla td.num { text-align: right; }
  table.inf-tabla td { padding: 10px 12px; border-bottom: 1px solid #eee; color: #222; }
  table.inf-tabla tr:last-child td { border-bottom: none; }
  table.inf-tabla td.destacado { font-weight: 700; }
  table.inf-tabla tr.fila-suave td { color: #999; font-style: italic; }

  .inf-genericos { background: #f8f8f8; border: 1px dashed #ccc; border-radius: 6px; padding: 16px 20px; font-size: 13px; color: #555; line-height: 1.6; }
  .inf-genericos strong { color: #333; }

  .inf-pie { margin-top: 36px; padding-top: 16px; border-top: 1px solid #ddd; font-size: 11px; color: #999; line-height: 1.5; }

  .inf-vacio { text-align: center; padding: 40px 20px; color: #999; font-size: 15px; }

  /* ── Impresión ── */
  @media print {
    body { display: block; background: #fff; }
    .sidebar, .topbar, .controles, .btn-imprimir, .no-print { display: none !important; }
    .main { margin-left: 0; }
    .contenido { padding: 0; }
    .informe { max-width: none; padding: 0; border-radius: 0; }
    @page { margin: 1.4cm; }
  }
</style>
</head>

<script>
const SUPABASE_URL = 'https://istrnsicleopzbsrapsw.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImlzdHJuc2ljbGVvcHpic3JhcHN3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU4MTIxMTYsImV4cCI6MjA5MTM4ODExNn0.5UXV2LWPXmbfLI7rKpZSG9YBzZsesjckHnhQabA0mTY';
const { createClient } = supabase;
const sb = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const LOGOS = {
  bosch_pascual: '../assets/logos/bosch_pascual_logo_white.svg',
  recop: '../assets/logos/recop_logo_white.svg'
};

function esc(txt) { const d = document.createElement('div'); d.textContent = String(txt == null ? '' : txt); return d.innerHTML; }

function fmtFecha(iso) {
  if (!iso) return null;
  const d = new Date(iso + 'T00:00:00');
  return d.toLocaleDateString('es-ES', { day: '2-digit', month: 'long', year: 'numeric' });
}

function fmtHoy() {
  return new Date().toLocaleDateString('es-ES', { day: '2-digit', month: 'long', year: 'numeric' });
}

// ── Carga de obras en el selector ──
async function cargarObras() {
  const sel = document.getElementById('sel-obra');
  const { data, error } = await sb.from('obras').select('id, nombre, estado').neq('estado', 'oculta').order('nombre');
  if (error) {
    sel.innerHTML = '<option value="">Error al cargar obras</option>';
    return;
  }
  if (!data || !data.length) {
    sel.innerHTML = '<option value="">No hay obras</option>';
    return;
  }
  // 74a (3/9/2026). "Todas las obras" es ahora la opción por defecto: la RPC
  // acepta p_obra_id = null y devuelve el agregado de las obras que el usuario
  // puede ver, con las ocultas fuera. Una obra concreta sigue funcionando igual.
  sel.innerHTML = '<option value="">Todas las obras</option>' +
    data.map(o => `<option value="${esc(o.id)}">${esc(o.nombre)}${(o.estado && o.estado !== 'activa') ? ` (${esc(o.estado)})` : ''}</option>`).join('');
}

// ── Generar el informe ──
async function generar() {
  const obraId = document.getElementById('sel-obra').value;
  const desde = document.getElementById('inp-desde').value || null;
  const hasta = document.getElementById('inp-hasta').value || null;
  const zona = document.getElementById('zona-informe');
  const btnImp = document.getElementById('btn-imprimir');

  btnImp.disabled = true;

  if (desde && hasta && desde > hasta) {
    zona.innerHTML = '<div class="aviso-error">La fecha «Desde» es posterior a «Hasta». Revísalas.</div>';
    return;
  }

  zona.innerHTML = '<div class="cargando">Generando informe…</div>';

  const { data, error } = await sb.rpc('informe_rojos', {
    p_obra_id: obraId || null,
    p_desde: desde,
    p_hasta: hasta
  });

  if (error) {
    zona.innerHTML = `<div class="aviso-error">No se pudo generar el informe: ${esc(error.message)}</div>`;
    return;
  }

  pintarInforme(data, { desde, hasta });
  btnImp.disabled = false;
}

// ── Pintar el informe con los datos de la RPC ──
function pintarInforme(d, rango) {
  const zona = document.getElementById('zona-informe');
  const logo = LOGOS[d.obra_marca] || LOGOS.bosch_pascual;

  // Texto del periodo
  let periodoTxt;
  const fd = fmtFecha(rango.desde);
  const fh = fmtFecha(rango.hasta);
  if (fd && fh) periodoTxt = `Del ${fd} al ${fh}`;
  else if (fd) periodoTxt = `Desde ${fd}`;
  else if (fh) periodoTxt = `Hasta ${fh}`;
  else periodoTxt = 'Todo el histórico registrado';

  const total = d.total_intentos || 0;
  const personas = d.total_personas || 0;

  // Excepciones asumidas: entradas autorizadas SIN la documentación en regla.
  //
  // D1-bis (31/8/2026, decisión de Dani). Esto va en el informe que ve la
  // propiedad, con el nombre del jefe que firmó cada una. No es un descuido:
  // si la aplicación existe para sacar a la luz lo que antes no se veía,
  // esconder precisamente esto la vaciaría de sentido.
  const ex = d.excepciones || {};
  const exJefes    = Array.isArray(ex.jefes) ? ex.jefes : [];
  const exEmpresas = Array.isArray(ex.empresas) ? ex.empresas : [];
  const exDetalle  = Array.isArray(ex.detalle) ? ex.detalle : [];
  const exTotal    = ex.total || 0;
  const exPersonas = ex.personas || 0;
  const exRevocadas = ex.revocadas || 0;

  // Presentes sin registrar (personas sin ficha)
  const sr = d.sin_registrar || {};
  const srPersonas = Array.isArray(sr.personas) ? sr.personas : [];
  const srEmpresas = Array.isArray(sr.empresas) ? sr.empresas : [];
  const srTotalPersonas = sr.total_personas || 0;
  const srTotalIntentos = sr.total_intentos || 0;

  // Caso sin datos (ni rojos documentales ni presentes sin registrar)
  if (total === 0 && srTotalPersonas === 0 && exTotal === 0 && !(d.rondas && d.rondas.rondas > 0)) {
    zona.innerHTML = `
      <div class="informe">
        ${cabeceraHTML(logo, d.obra_nombre, periodoTxt)}
        <div class="inf-vacio">No se registraron accesos denegados durante el periodo seleccionado.</div>
        ${pieHTML()}
      </div>`;
    return;
  }

  // Reparto del titular. Sin esto el 121 es un número sin consecuencia, y las
  // cuatro salidas de abajo se leen como si unas salieran de otras.
  const _d = d.desenlace || {};
  const _noEntro = _d.no_entro || 0;
  const _entraron = (_d.regularizado || 0) + (_d.con_excepcion || 0) + (_d.colado || 0);
  let repartoHTML = '';
  if ((_d.dias_persona || 0) > 0) {
    repartoHTML = `<div class="reparto">
      De esos, <strong>${_noEntro}</strong> no llegaron a entrar ese día
      y <strong>${_entraron}</strong> acabaron entrando tras resolverse la situación.
    </div>`;
  }

  // Titular (solo si hay rojos documentales)
  let titular = '';
  if (total > 0) {
    titular = `
    <div class="inf-titular">
      <div class="cifra">${total}</div>
      <div class="frase">accesos frenados por el sistema, de <strong>${personas}</strong> ${personas === 1 ? 'persona' : 'personas'} distintas sin la documentación en regla.</div>
      ${repartoHTML}
    </div>`;
  }

  // ── Desenlace (74a, 3/9/2026) ──
  //
  // Contesta a la única pregunta que un jefe hace de verdad al ver la cifra
  // grande: "vale, 121 intentos frenados, ¿pero entraron o no?". Sin esto el
  // titular es un número sin consecuencia.
  //
  // El "0 se colaron" es el dato que sostiene la aplicación entera, y por eso
  // se PINTA aunque valga cero: un cero que no se calcula no demuestra nada.
  // Se pinta con su límite escrito al lado — solo cubre a quien tiene ficha —
  // porque una cifra que promete más de lo que mide se cae en la primera
  // pregunta incómoda.
  const des = d.desenlace || {};
  let desenlaceHTML = '';
  if ((des.dias_persona || 0) > 0) {
    const noEntro = des.no_entro || 0;
    const volvio  = des.volvio_7dias || 0;

    // El "0 entraron sin autorización" se pinta SIEMPRE, aunque valga cero.
    // Un cero que no se calcula no demuestra nada, y este es el dato que
    // sostiene la aplicación entera. Va en verde porque aquí cero es la nota
    // buena, no la ausencia de datos.
    desenlaceHTML = `
      <div class="inf-seccion">
        <h2>Qué pasó después del bloqueo</h2>
        <div class="subtitulo">${des.dias_persona} bloqueos, contados por persona y día. Cada uno acabó de una de estas cuatro formas.</div>

        <div class="des-fila">
          <div class="des-num">${noEntro}</div>
          <div class="des-cuerpo">
            <div class="des-tit">No llegaron a entrar ese día</div>
            <div class="des-exp">El sistema paró la entrada porque faltaba documentación.</div>
          </div>
        </div>
        ${volvio > 0 ? `<div class="des-anidada">
          De esos ${noEntro}, <strong>${volvio}</strong> volvieron a entrar dentro de los 7 días siguientes,
          una vez resuelta la documentación. El bloqueo no apartó a la gente de la obra:
          retrasó la entrada hasta que el papel estuvo en regla.
        </div>` : ''}

        <div class="des-fila">
          <div class="des-num">${des.regularizado || 0}</div>
          <div class="des-cuerpo">
            <div class="des-tit">Se regularizó el mismo día</div>
            <div class="des-exp">Se les frenó, se corrigió la documentación y entraron esa misma jornada.</div>
          </div>
        </div>

        <div class="des-fila">
          <div class="des-num">${des.con_excepcion || 0}</div>
          <div class="des-cuerpo">
            <div class="des-tit">Entraron con excepción firmada</div>
            <div class="des-exp">Un jefe de obra autorizó el paso asumiendo la responsabilidad, con su nombre y su motivo escritos.</div>
          </div>
        </div>

        <div class="des-fila des-cero">
          <div class="des-num">${des.colado || 0}</div>
          <div class="des-cuerpo">
            <div class="des-tit">Entraron por el control estando en rojo</div>
            <div class="des-exp">Sin excepción firmada por nadie. Esta cifra se calcula en cada informe, no se da por supuesta.</div>
          </div>
        </div>

        <div class="inf-genericos" style="margin-top:16px">
          Estas cifras cuentan lo que pasa <strong>en el control de acceso</strong>.
          No dicen que nadie pueda estar en la obra sin haber fichado: para eso está
          el apartado de <strong>rondas del encargado</strong>, más abajo, que es
          precisamente el que detecta esos casos.
        </div>
      </div>`;
  }

  // ── Rondas del encargado (74a-ter, 3/9/2026) ──
  //
  // El segundo ojo del sistema. La puerta ve a quien pasa por ella; la ronda
  // ve a quien ya está dentro. Este capítulo es el que sostiene el argumento
  // de verdad: la aplicación no es un muro infranqueable, es algo mejor —
  // ENSEÑA lo que antes no veía nadie.
  const ron = d.rondas || {};
  let rondasHTML = '';
  if ((ron.rondas || 0) > 0) {
    const sinFichar = ron.personas_sin_fichar || 0;
    rondasHTML = `
      <div class="inf-seccion">
        <h2>Rondas del encargado: quién estaba dentro sin fichar</h2>
        <div class="subtitulo">El control de acceso vigila la entrada. La ronda comprueba, sobre el terreno, quién hay realmente en la obra y si ha fichado.</div>

        <div class="des-fila">
          <div class="des-num">${ron.rondas}</div>
          <div class="des-cuerpo">
            <div class="des-tit">Rondas realizadas</div>
            <div class="des-exp">Repartidas en ${ron.dias_con_ronda || 0} días distintos.</div>
          </div>
        </div>

        <div class="des-fila">
          <div class="des-num">${ron.con_hallazgo || 0}</div>
          <div class="des-cuerpo">
            <div class="des-tit">Rondas que detectaron algo</div>
            <div class="des-exp">En el resto, todo el mundo en obra había fichado correctamente.</div>
          </div>
        </div>

        <div class="des-fila">
          <div class="des-num">${sinFichar}</div>
          <div class="des-cuerpo">
            <div class="des-tit">Personas encontradas en obra sin haber fichado</div>
            <div class="des-exp">Sumando todas las rondas. En la peor de ellas se detectaron ${ron.peor_ronda || 0} a la vez.</div>
          </div>
        </div>

        ${Array.isArray(ron.por_obra) && ron.por_obra.length > 1 ? `
        <table class="inf-tabla" style="margin-top:18px">
          <thead><tr><th>Obra</th><th class="num">Rondas</th><th class="num">Con hallazgo</th><th class="num">Personas sin fichar</th></tr></thead>
          <tbody>
            ${ron.por_obra.map(o => `
              <tr>
                <td class="destacado">${esc(o.obra_nombre)}</td>
                <td class="num">${o.rondas}</td>
                <td class="num">${o.con_hallazgo}</td>
                <td class="num">${o.personas_sin_fichar}</td>
              </tr>`).join('')}
          </tbody>
        </table>` : ''}

        <div class="inf-genericos" style="margin-top:16px">
          La ronda registra <strong>cuántas</strong> personas había sin fichar, no quiénes.
          Estas cifras miden por tanto el alcance del problema, no la responsabilidad individual.
        </div>
      </div>`;
  }

  // Desglose por obra (solo cuando el informe agrupa varias)
  const porObra = Array.isArray(d.por_obra) ? d.por_obra : [];
  let porObraHTML = '';
  if (porObra.length > 1) {
    porObraHTML = `
      <div class="inf-seccion">
        <h2>Desglose por obra</h2>
        <div class="subtitulo">El total de arriba, repartido. Cada jefe de obra puede generar el suyo por separado.</div>
        <table class="inf-tabla">
          <thead><tr><th>Obra</th><th class="num">Bloqueos</th><th class="num">Personas</th></tr></thead>
          <tbody>
            ${porObra.map(o => `
              <tr>
                <td class="destacado">${esc(o.obra_nombre)}</td>
                <td class="num">${o.veces}</td>
                <td class="num">${o.personas}</td>
              </tr>`).join('')}
          </tbody>
        </table>
      </div>`;
  }

  // Tabla de categorías
  const cats = Array.isArray(d.categorias) ? d.categorias : [];
  let categoriasHTML;
  if (cats.length) {
    categoriasHTML = `
      <div class="inf-seccion">
        <h2>Qué documento faltaba</h2>
        <div class="subtitulo">A una misma persona se le frena cada día que se presenta hasta que el documento se resuelve, por eso hay más frenazos que personas. Un bloqueo puede deberse a varios documentos a la vez.</div>
        <table class="inf-tabla">
          <thead><tr><th>Documento que faltaba</th><th class="num">Personas</th><th class="num">Veces frenadas</th></tr></thead>
          <tbody>
            ${cats.map(c => `
              <tr>
                <td class="destacado">
                  ${esc(c.categoria)}${c.es_empresa ? '<span class="cat-empresa">EMPRESA</span>' : ''}
                  ${c.estados ? `<div class="cat-estado">${esc(c.estados.toLowerCase())}</div>` : ''}
                </td>
                <td class="num">${c.personas}</td>
                <td class="num">${c.veces}</td>
              </tr>`).join('')}
          </tbody>
        </table>
      </div>`;
  } else {
    categoriasHTML = '';
  }

  // Ranking de empresas
  const emps = Array.isArray(d.empresas) ? d.empresas : [];
  let empresasHTML = '';
  if (emps.length) {
    empresasHTML = `
      <div class="inf-seccion">
        <h2>Empresas con más accesos denegados</h2>
        <div class="subtitulo">Ordenadas por número de intentos frenados. Aquí se cuentan todos los intentos, incluidos los que no tienen desglose por motivo.</div>
        <table class="inf-tabla">
          <thead><tr><th>Empresa</th><th class="num">Personas</th><th class="num">Veces frenadas</th></tr></thead>
          <tbody>
            ${emps.map(e => {
              const suave = e.empresa_nombre === 'Sin empresa asignada';
              return `
              <tr class="${suave ? 'fila-suave' : ''}">
                <td class="${suave ? '' : 'destacado'}">${esc(e.empresa_nombre)}</td>
                <td class="num">${e.personas}</td>
                <td class="num">${e.veces}</td>
              </tr>`;
            }).join('')}
          </tbody>
        </table>
      </div>`;
  }

  // Genéricos (sin desglose)
  const gen = d.genericos_intentos || 0;
  let genericosHTML = '';
  if (gen > 0) {
    genericosHTML = `
      <div class="inf-seccion">
        <h2>Frenados sin desglose</h2>
        <div class="inf-genericos">
          <strong>${gen}</strong> de los ${total} intentos (de ${d.genericos_personas} personas) se registraron antes de que el sistema guardara el motivo detallado. Cuentan como accesos denegados, pero no aparecen en el desglose por motivo de arriba.
        </div>
      </div>`;
  }

  // Sección presentes sin registrar
  let sinRegHTML = '';
  if (srPersonas.length) {
    sinRegHTML = `
      <div class="inf-seccion">
        <h2>Presentes sin registrar</h2>
        <div class="subtitulo">Personas que estaban físicamente en la obra e intentaron fichar sin constar en el sistema (empresa no dada de alta, contrato sin firmar, etc.). El nombre y la empresa son datos declarados por la propia persona, sin verificar. Total: ${srTotalPersonas} ${srTotalPersonas === 1 ? 'persona' : 'personas'} · ${srTotalIntentos} ${srTotalIntentos === 1 ? 'intento' : 'intentos'}.</div>
        <table class="inf-tabla">
          <thead><tr><th>Persona (declarada)</th><th>Empresa declarada</th><th>DNI</th><th class="num">Intentos</th></tr></thead>
          <tbody>
            ${srPersonas.map(p => `
              <tr>
                <td class="destacado">${esc(p.nombre || '(no facilitado)')}</td>
                <td>${esc(p.empresa || '(no facilitada)')}</td>
                <td>${esc(p.dni || '')}</td>
                <td class="num">${p.intentos || 1}</td>
              </tr>`).join('')}
          </tbody>
        </table>
        ${srEmpresas.length ? `
        <div class="subtitulo" style="margin-top:14px;">Por empresa declarada:</div>
        <table class="inf-tabla">
          <thead><tr><th>Empresa declarada</th><th class="num">Personas</th><th class="num">Intentos</th></tr></thead>
          <tbody>
            ${srEmpresas.map(e => `
              <tr>
                <td class="destacado">${esc(e.empresa_nombre)}</td>
                <td class="num">${e.personas}</td>
                <td class="num">${e.intentos}</td>
              </tr>`).join('')}
          </tbody>
        </table>` : ''}
      </div>`;
  }

  // Sección de excepciones asumidas
  let excepHTML = '';
  if (exTotal > 0) {
    excepHTML = `
      <div class="inf-seccion">
        <h2>Entradas autorizadas sin documentación en regla</h2>
        <div class="subtitulo">El sistema bloqueó a estas personas y un jefe de obra decidió dejarlas pasar igualmente, asumiendo la responsabilidad con su nombre y la fecha. Total: <strong>${exTotal}</strong> ${exTotal === 1 ? 'autorización' : 'autorizaciones'} sobre ${exPersonas} ${exPersonas === 1 ? 'persona' : 'personas'}${exRevocadas > 0 ? `, de las cuales ${exRevocadas} se retiraron después` : ''}.</div>

        ${exJefes.length ? `
        <table class="inf-tabla">
          <thead><tr><th>Autorizado por</th><th class="num">Veces</th><th class="num">Personas</th></tr></thead>
          <tbody>
            ${exJefes.map(j => `
              <tr>
                <td class="destacado">${esc(j.jefe)}</td>
                <td class="num">${j.veces}</td>
                <td class="num">${j.personas}</td>
              </tr>`).join('')}
          </tbody>
        </table>` : ''}

        ${exEmpresas.length ? `
        <div class="subtitulo" style="margin-top:14px;">Por empresa. Una empresa que aparece mucho aquí es una empresa cuya documentación llega tarde una y otra vez:</div>
        <table class="inf-tabla">
          <thead><tr><th>Empresa</th><th class="num">Veces</th><th class="num">Personas</th></tr></thead>
          <tbody>
            ${exEmpresas.map(e => {
              const suave = e.empresa_nombre === 'Sin empresa asignada';
              return `
              <tr class="${suave ? 'fila-suave' : ''}">
                <td class="${suave ? '' : 'destacado'}">${esc(e.empresa_nombre)}</td>
                <td class="num">${e.veces}</td>
                <td class="num">${e.personas}</td>
              </tr>`;
            }).join('')}
          </tbody>
        </table>` : ''}

        <div class="subtitulo" style="margin-top:14px;">Una por una. El motivo es el que escribió el jefe de obra en el momento de autorizar, tal cual:</div>
        <table class="inf-tabla">
          <thead><tr><th>Fecha</th><th>Persona</th><th>Empresa</th><th>Autoriza</th><th>Motivo</th></tr></thead>
          <tbody>
            ${exDetalle.map(x => {
              const retirada = x.estado === 'revocada';
              const motivo = esc(x.motivo_autorizacion || '(sin motivo)') +
                (retirada ? `<br><em>Retirada: ${esc(x.motivo_revocacion || 'sin motivo')}</em>` : '');
              return `
              <tr class="${retirada ? 'fila-suave' : ''}">
                <td>${esc(fmtFechaCorta(x.fecha))}</td>
                <td class="${retirada ? '' : 'destacado'}">${esc(x.persona)}</td>
                <td>${esc(x.empresa_nombre)}</td>
                <td>${esc(x.jefe)}</td>
                <td>${motivo}</td>
              </tr>`;
            }).join('')}
          </tbody>
        </table>
      </div>`;
  }

  zona.innerHTML = `
    <div class="informe">
      ${cabeceraHTML(logo, d.obra_nombre, periodoTxt)}
      ${titular}
      ${desenlaceHTML}
      ${rondasHTML}
      ${porObraHTML}
      ${categoriasHTML}
      ${empresasHTML}
      ${excepHTML}
      ${sinRegHTML}
      ${genericosHTML}
      ${pieHTML()}
    </div>`;
}

function fmtFechaCorta(iso) {
  if (!iso) return '';
  const d = new Date(iso + 'T00:00:00');
  return d.toLocaleDateString('es-ES', { day: '2-digit', month: '2-digit', year: 'numeric' });
}

function cabeceraHTML(logo, obraNombre, periodoTxt) {
  return `
    <div class="inf-cabecera">
      <div>
        <div class="inf-titulo">Informe de accesos denegados</div>
        <div class="inf-obra">${esc(obraNombre || 'Obra')}</div>
        <div class="inf-meta">${esc(periodoTxt)}</div>
      </div>
      <div class="lado-derecho">
        <img class="logo-marca" src="${logo}" alt="" onerror="this.style.display='none'">
        <div class="inf-meta">Generado el ${fmtHoy()}</div>
      </div>
    </div>`;
}

function pieHTML() {
  return `
    <div class="inf-pie">
      Datos reales registrados de forma automática por el sistema de control de acceso, sin intervención manual. Cada «intento frenado» corresponde a un trabajador que escaneó el QR de la obra e introdujo su DNI, y al que el sistema denegó el paso por no tener la documentación en regla en ese momento.
    </div>`;
}

// ── Init: comprobar sesión de admin ──
(async function init() {
  // El guardián de sesión vive en js/guardian.js, igual en las 20 pantallas.
  // Separa "no tienes permiso" de "ha fallado la red" y de "estás de baja",
  // que antes se confundían en un mismo redirect mudo al login.
  const g = await Guardian.entrar(sb, { rol: 'admin', campos: 'nombre', volver: '../' });
  if (!g) return;
  const session = g.session;
  const usuario = g.usuario;
  document.getElementById('usuario-email').textContent = usuario.nombre || session.user.email;

  if (window.AutoLogout) AutoLogout.init(sb);

  await cargarObras();

  document.getElementById('btn-generar').addEventListener('click', generar);
  document.getElementById('btn-imprimir').addEventListener('click', () => window.print());
  document.getElementById('btn-salir').addEventListener('click', async () => {
    await sb.auth.signOut();
    window.location.href = '../';
  });
})();
</script>
</body>
</html>
