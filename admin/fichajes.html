<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fichajes — Admin</title>
<link rel="icon" type="image/png" href="../assets/icons/portium-192.png">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/guardian.js"></script>
<script src="../js/menu-admin.js"></script>
<style>
  :root {
    --verde: #4caf50; --naranja: #ff9800; --rojo: #f44336; --azul: #2196f3;
    --bg: #111318; --bg2: #1a1d24; --bg3: #22262f; --borde: #2e3340;
    --texto: #e8eaf0; --texto2: #8b909e; --sidebar-w: 200px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: var(--bg); color: var(--texto); min-height: 100vh; display: flex; }
  .sidebar { width: var(--sidebar-w); background: var(--bg2); border-right: 1px solid var(--borde); display: flex; flex-direction: column; position: fixed; top: 0; left: 0; bottom: 0; z-index: 10; }
  .sidebar-brand { padding: 18px 16px; border-bottom: 1px solid var(--borde); display: flex; align-items: center; justify-content: center; gap: 14px; }
  .sidebar-brand img { height: 22px; width: auto; opacity: 0.9; }
  .sidebar-section { padding: 18px 14px 6px; font-size: 10px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; color: var(--texto2); }
  .sidebar a { display: flex; align-items: center; gap: 10px; padding: 10px 14px; font-size: 14px; color: var(--texto2); text-decoration: none; border-radius: 8px; margin: 2px 8px; transition: background 0.15s, color 0.15s; }
  .sidebar a:hover { background: var(--bg3); color: var(--texto); }
  .sidebar a.activo { background: var(--bg3); color: var(--texto); font-weight: 600; }
  .sidebar a .ico { font-size: 16px; width: 20px; text-align: center; }
  .sidebar-bottom { margin-top: auto; padding: 16px; border-top: 1px solid var(--borde); }
  .btn-salir { width: 100%; background: transparent; border: 1px solid var(--borde); color: var(--texto2); padding: 9px 14px; border-radius: 8px; cursor: pointer; font-size: 13px; font-family: inherit; text-align: left; display: flex; align-items: center; gap: 8px; }
  .btn-salir:hover { background: var(--bg3); color: var(--texto); }
  .main { margin-left: var(--sidebar-w); flex: 1; display: flex; flex-direction: column; }
  .topbar { padding: 20px 28px; display: flex; align-items: center; justify-content: space-between; }
  .topbar h1 { font-size: 22px; font-weight: 800; letter-spacing: 0.5px; text-transform: uppercase; }
  .contenido { padding: 0 28px 28px; }
  .barra-filtros { display: flex; gap: 12px; margin-bottom: 16px; flex-wrap: wrap; align-items: center; }
  .barra-filtros input, .barra-filtros select { background: var(--bg2); border: 1px solid var(--borde); border-radius: 8px; color: var(--texto); font-size: 14px; padding: 9px 14px; font-family: inherit; }
  .barra-filtros input[type="date"]  { width: 160px; color-scheme: dark; }
  .barra-filtros input[type="month"] { width: 160px; color-scheme: dark; }
  .barra-filtros select { width: 230px; }
  .barra-filtros input:focus, .barra-filtros select:focus { outline: none; border-color: var(--azul); }
  .btn-secundario { background: transparent; color: var(--texto2); border: 1px solid var(--borde); padding: 8px 14px; border-radius: 8px; font-size: 13px; cursor: pointer; font-family: inherit; }
  .btn-secundario:hover { background: var(--bg3); color: var(--texto); }
  .link-proforma { display: inline-flex; align-items: center; gap: 7px; background: var(--bg3); color: var(--texto); border: 1px solid var(--borde); padding: 9px 14px; border-radius: 8px; font-size: 13px; font-weight: 600; text-decoration: none; }
  .link-proforma:hover { border-color: var(--azul); }
  .nota-proforma { font-size: 12px; color: var(--texto2); }
  .seccion { background: var(--bg2); border: 1px solid var(--borde); border-radius: 10px; overflow: hidden; }
  .seccion-cab { padding: 14px 20px; border-bottom: 1px solid var(--borde); display: flex; align-items: center; justify-content: space-between; }
  .seccion-cab h2 { font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; }
  .badge { font-size: 11px; font-weight: 600; padding: 3px 10px; border-radius: 20px; background: rgba(33,150,243,0.15); color: var(--azul); }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th { text-align: left; padding: 11px 20px; font-size: 11px; font-weight: 700; color: var(--texto2); text-transform: uppercase; letter-spacing: 0.5px; border-bottom: 1px solid var(--borde); }
  td { padding: 13px 20px; border-bottom: 1px solid var(--borde); vertical-align: middle; }
  tr:last-child td { border-bottom: none; }
  tr:hover td { background: var(--bg3); }
  .pill { display: inline-block; padding: 3px 10px; border-radius: 20px; font-size: 12px; font-weight: 600; }
  .pill.verde { background: rgba(76,175,80,0.15);  color: var(--verde); }
  .pill.azul  { background: rgba(33,150,243,0.15); color: var(--azul); }
  .vacio    { padding: 40px 20px; text-align: center; color: var(--texto2); font-size: 14px; }
  .cargando { padding: 40px 20px; text-align: center; color: var(--texto2); }
  .iconos-hab { display: inline-flex; align-items: center; gap: 3px; margin-left: 4px; vertical-align: middle; color: var(--texto2); }
  /* 24/9/2026 - Iconos de habilitación coloreados por estado, misma regla en
     toda la app: azul = vigente o no caduca; naranja = caduca pronto o le
     falta la fecha; rojo = caducada. */
  .hab-est { display: inline-flex; align-items: center; cursor: default; }
  .hab-est.vigente, .hab-est.no_caduca { color: var(--azul); }
  .hab-est.proxima, .hab-est.falta_fecha { color: var(--naranja); }
  .hab-est.caducada { color: var(--rojo); }
</style>
<script src="../js/auto-logout.js"></script>
<script src="../js/fechas.js"></script>
<script src="../js/habilitaciones.js?v=20260915"></script>
</head>
<body>

<div id="sidebar-admin"></div>

<div class="main">
  <div class="topbar"><h1>Fichajes</h1></div>
  <div class="contenido">
    <div class="barra-filtros">
      <input type="date" id="filtro-fecha">
      <select id="filtro-obra"><option value="">Todas las obras</option></select>
      <button class="btn-secundario" id="btn-buscar">Buscar</button>
      <button class="btn-secundario" id="btn-hoy">Hoy</button>
      <a class="link-proforma" href="../jefe/resumen-mes.html">📊 Excel proforma</a>
      <span class="nota-proforma">El proforma mensual se genera en Resumen · Proforma.</span>
    </div>
    <div class="seccion">
      <div class="seccion-cab">
        <h2>Historial de fichajes</h2>
        <span class="badge" id="badge-total">—</span>
      </div>
      <div id="tabla-fichajes"><div class="cargando">Cargando…</div></div>
    </div>
  </div>
</div>

<script>
const SUPABASE_URL = 'https://istrnsicleopzbsrapsw.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImlzdHJuc2ljbGVvcHpic3JhcHN3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU4MTIxMTYsImV4cCI6MjA5MTM4ODExNn0.5UXV2LWPXmbfLI7rKpZSG9YBzZsesjckHnhQabA0mTY';
const { createClient } = supabase;
const sb = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
window._sbAdmin = sb;
AutoLogout.init(sb);

if (!window.Fechas || !window.Hab) {
  document.body.innerHTML = '<div style="padding:40px;font-family:system-ui;color:#f44336">No se han cargado js/fechas.js y js/habilitaciones.js. Recarga la página.</div>';
  throw new Error('Faltan los módulos Fechas/Hab');
}

(async function init() {
  const g = await Guardian.entrar(sb, { rol: 'admin', volver: '../' });
  if (!g) return;
  document.getElementById('filtro-fecha').value = fechaHoy();
  await cargarObras();
  await buscar();
})();

// «Cerrar sesión» lo inyecta y gestiona js/menu-admin.js (92ª). El listener
// que había aquí corría ANTES de la inyección: getElementById devolvía null y el
// TypeError mataba todo lo que venía después en este script (100ª).

async function cargarObras() {
  const { data } = await sb.from('obras').select('id, nombre, estado').neq('estado', 'oculta').order('nombre');
  const select = document.getElementById('filtro-obra');
  (data || []).forEach(o => {
    const opt = document.createElement('option');
    opt.value = o.id;
    opt.textContent = (o.estado && o.estado !== 'activa') ? `${o.nombre} (${o.estado})` : o.nombre;
    select.appendChild(opt);
  });
}

document.getElementById('btn-buscar').onclick = buscar;
document.getElementById('btn-hoy').onclick = () => { document.getElementById('filtro-fecha').value = fechaHoy(); buscar(); };

async function buscar() {
  document.getElementById('tabla-fichajes').innerHTML = '<div class="cargando">Cargando…</div>';
  const fecha  = document.getElementById('filtro-fecha').value;
  const obraId = document.getElementById('filtro-obra').value;

  let query = sb.from('fichajes')
    .select('id, tipo, hora, trabajador_id, cierre_automatico, es_tarde, fuera_de_zona, es_manual, origen, corregido_por, trabajador:trabajador_id(nombre, apellidos, dni), obra:obra_id(nombre)')
    .order('hora', { ascending: false }).limit(200);

  if (fecha) {
    const [y, m, d] = fecha.split('-').map(Number);
    const desde = new Date(y, m - 1, d, 0, 0, 0, 0);
    const hasta = new Date(y, m - 1, d, 23, 59, 59, 999);
    query = query.gte('hora', desde.toISOString()).lte('hora', hasta.toISOString());
  }
  if (obraId) query = query.eq('obra_id', obraId);

  const { data, error } = await query;
  if (error || !data || data.length === 0) {
    document.getElementById('badge-total').textContent = '0 registros';
    document.getElementById('tabla-fichajes').innerHTML = '<div class="vacio">No hay fichajes para estos filtros</div>';
    return;
  }

  const ids = [...new Set(data.map(f => f.trabajador_id).filter(Boolean))];
  const habIconos = {};
  if (ids.length > 0) {
    const { data: habs } = await sb.from('habilitaciones_trabajador')
      .select('trabajador_id, fecha_caducidad, sin_caducidad, tipo:tipo_habilitacion_id(nombre)')
      .in('trabajador_id', ids).eq('activo', true);
    (habs || []).forEach(h => meterIconoHab(habIconos, h));
  }

  document.getElementById('badge-total').textContent = data.length + ' registros';
  document.getElementById('tabla-fichajes').innerHTML = `
    <table><thead><tr>
      <th>Trabajador</th><th>DNI</th><th>Obra</th><th>Tipo</th><th>Hora</th><th>Avisos</th>
    </tr></thead>
    <tbody>${data.map(f => {
      const avisos = [];
      if (f.cierre_automatico) avisos.push('⏰ Autocierre');
      if (f.es_tarde)          avisos.push('🕐 Tarde');
      if (f.fuera_de_zona)     avisos.push('📍 Fuera de zona');
      if (f.es_manual)         avisos.push('✍️ Manual');
      if (f.corregido_por)     avisos.push('🛠️ Corregido');
      const iconosHtml = htmlIconosHab(habIconos[f.trabajador_id], 'iconos-hab');
      return `<tr>
        <td><strong>${esc(f.trabajador?.nombre)} ${esc(f.trabajador?.apellidos)}</strong>${iconosHtml}</td>
        <td>${esc(f.trabajador?.dni)}</td>
        <td>${esc(f.obra?.nombre)}</td>
        <td><span class="pill ${f.tipo === 'entrada' ? 'verde' : 'azul'}">${esc(f.tipo)}</span></td>
        <td>${formatFechaHora(f.hora)}</td>
        <td>${avisos.length ? avisos.join(' ') : '—'}</td>
      </tr>`;
    }).join('')}</tbody></table>`;
}

function fechaHoy() { return new Date().toISOString().split('T')[0]; }
// Icono SVG de habilitación con respaldo al emoji si el navegador tiene en
// caché un habilitaciones.js sin iconoSvg (migración de iconos, sept 2026).
function icoHab(tipo, px) {
  return (typeof Hab.iconoSvg === 'function') ? Hab.iconoSvg(tipo, px) : Hab.icono(tipo);
}
// Lista de habilitaciones de un trabajador → iconos en fila + nombres para
// el title. Los nombres van escapados también para comillas.
// 24/9/2026 - Cada icono lleva el color de su estado y su propio texto al
// pasar el ratón (nombre + caducidad), igual que en Presencia.
function htmlIconosHab(lista, clase) {
  if (!lista || !lista.length) return '';
  const iconos = lista.map(x => {
    const est = ['vigente', 'no_caduca', 'proxima', 'caducada', 'falta_fecha'].indexOf(x.estado) !== -1
      ? x.estado : 'falta_fecha';
    const tit = String(esc(x.nombre + (x.texto ? ' — ' + x.texto : ''))).replace(/"/g, '&quot;');
    return '<span class="hab-est ' + est + '" title="' + tit + '">' + x.icono + '</span>';
  }).join('');
  return ' <span class="' + clase + '">' + iconos + '</span>';
}
// Si dos habilitaciones comparten dibujo (toro y carretilla), manda la peor.
function gravedadHab(estado) {
  return ({ caducada: 4, proxima: 3, falta_fecha: 2, vigente: 1, no_caduca: 1 })[estado] || 2;
}
function meterIconoHab(mapa, h) {
  const nombreTipo = h.tipo?.nombre || '';
  const icono = icoHab(nombreTipo, 18);
  const estado = Hab.estado(h);
  const item = { icono, nombre: nombreTipo, estado, texto: Hab.textoCaducidad(h) };
  const lista = mapa[h.trabajador_id] || (mapa[h.trabajador_id] = []);
  const i = lista.findIndex(x => x.icono === icono);
  if (i === -1) lista.push(item);
  else if (gravedadHab(estado) > gravedadHab(lista[i].estado)) lista[i] = item;
}
function esc(txt) { const d = document.createElement('div'); d.textContent = String(txt || ''); return d.innerHTML; }
function formatFechaHora(iso) { if (!iso) return '—'; const d = new Date(iso); return d.toLocaleDateString('es-ES', { day: '2-digit', month: '2-digit' }) + ' ' + d.toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit' }); }
</script>
</body>
</html>
